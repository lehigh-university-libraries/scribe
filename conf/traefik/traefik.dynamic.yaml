http:
  middlewares:
    cantaloupe-strip-prefix:
      stripPrefix:
        prefixes:
          - /cantaloupe
    cantaloupe-custom-request-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Path: /cantaloupe
{{- if (eq (env "TRAEFIK_TLS_FRONTEND") "true") }}
          X-Forwarded-Port: 443
{{- end }}
    cantaloupe:
      chain:
        middlewares:
          - cantaloupe-strip-prefix
          - cantaloupe-custom-request-headers
  services:
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:8080
    cantaloupe:
      loadBalancer:
        servers:
          - url: http://cantaloupe:8182

  routers:
    frontend:
      rule: PathPrefix(`/`)
      service: frontend
    cantaloupe:
      rule: PathPrefix(`/cantaloupe`)
      middlewares:
        - cantaloupe
      service: cantaloupe
