services:
  traefik:
    image: traefik:v3.6.13@sha256:34d5089d0b414945342848518b383f11f5b3a645504ed87b77ffeb9d683d0e48
    command: >-
      --entryPoints.web.address=:80
      --entryPoints.web.forwardedHeaders.trustedIPs=10.0.0.0/8,127.0.0.1/32,172.0.0.0/8
      --entryPoints.web.transport.respondingTimeouts.readTimeout=3600
      --providers.file.filename=/etc/traefik/dynamic.yaml
      --providers.file.watch=true
    ports:
      - "80:80"
    volumes:
      - ./conf/traefik/traefik.dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    depends_on:
      - frontend
      - cantaloupe

  mariadb:
    image: mariadb:12.2@sha256:e0236fc6386e7eacd9359e59d0a078bd7aa0d18280d36d13061121bedeaee903
    environment:
      MARIADB_DATABASE: scribe
      MARIADB_USER: scribe
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
    volumes:
      - mariadb-data:/var/lib/mysql
    secrets:
      - mariadb_password
      - mariadb_root_password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${SCRIBE_API_IMAGE:-ghcr.io/lehigh-university-libraries/scribe:main}
    build: .
    environment:
      VAULT_TOKEN: ${VAULT_TOKEN:-}
    volumes:
      - ./config.yaml:/etc/scribe/config.yaml:ro
      - ./secrets:/run/secrets/scribe:ro
      - uploads-data:/app/uploads
      - cache-data:/app/cache
    depends_on:
      mariadb:
        condition: service_healthy

  worker:
    image: ${SCRIBE_API_IMAGE:-ghcr.io/lehigh-university-libraries/scribe:main}
    build: .
    command: ["/app/scribe-worker"]
    environment:
      VAULT_TOKEN: ${VAULT_TOKEN:-}
    volumes:
      - ./config.yaml:/etc/scribe/config.yaml:ro
      - ./secrets:/run/secrets/scribe:ro
      - uploads-data:/app/uploads
      - cache-data:/app/cache
    depends_on:
      mariadb:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    image: ${SCRIBE_FRONTEND_IMAGE:-scribe-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      PORT: "8080"
      SCRIBE_FRONTEND_BACKEND_ORIGIN: http://api:8080
    depends_on:
      api:
        condition: service_started

  cantaloupe:
    image: islandora/cantaloupe:6@sha256:b247b3ce151fdacc0e03117d01addb3da78a15bb067256dc606d37795b49da5f
    environment:
      CANTALOUPE_SOURCE_STATIC: FilesystemSource
      CANTALOUPE_FILESYSTEMSOURCE_LOOKUP_STRATEGY: BasicLookupStrategy
      CANTALOUPE_FILESYSTEMSOURCE_BASICLOOKUPSTRATEGY_PATH_PREFIX: /uploads/
      CANTALOUPE_ENDPOINT_IIIF_2_ENABLED: "true"
      CANTALOUPE_ENDPOINT_IIIF_3_ENABLED: "true"
      CANTALOUPE_HTTP_PORT: "8182"
    volumes:
      - uploads-data:/uploads:ro
      - cantaloupe-data:/data

volumes:
  mariadb-data:
  uploads-data:
  cache-data:
  cantaloupe-data:

secrets:
  mariadb_password:
    file: ./secrets/mariadb_password
  mariadb_root_password:
    file: ./secrets/mariadb_root_password
