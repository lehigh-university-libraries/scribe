services:
  mariadb:
    image: mariadb:12.3@sha256:b1c7bf836e64ed9406a8984af29509f40089d55cea14b32f12c4726a1f17104b
    environment:
      MARIADB_DATABASE: scribe
      MARIADB_USER: scribe
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
    volumes:
      - mariadb-data:/var/lib/mysql
    secrets:
      - mariadb_password
      - mariadb_root_password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  traefik:
    image: traefik:v3.7.5@sha256:e4d98158c01ad752fc1071d4e9573788747230d902cdde00a772516e692d07c9
    restart: unless-stopped
    command:
      - --api.insecure=false
      - --api.dashboard=false
      - --ping=true
      - --entryPoints.http.address=:80
      - --entryPoints.http.forwardedHeaders.insecure=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - "80:80"
    volumes:
      - ./conf/traefik/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      api:
        condition: service_started
      triplet:
        condition: service_started

  api:
    image: ${SCRIBE_API_IMAGE:-ghcr.io/lehigh-university-libraries/scribe:main}
    build: .
    expose:
      - "8080"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/GOOGLE_APPLICATION_CREDENTIALS
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      VAULT_ADDRESS: ${VAULT_ADDRESS:-}
      VAULT_WORKSPACE: ${VAULT_WORKSPACE:-dev}
      VAULT_SECRET_PREFIX: ${VAULT_SECRET_PREFIX:-scribe/dev}
      VAULT_GCP_AUTH_ROLE: ${VAULT_GCP_AUTH_ROLE:-scribe-app}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      OLLAMA_AUDIENCE: ${OLLAMA_AUDIENCE:-}
      OLLAMA_MODEL_ENDPOINTS_JSON: ${OLLAMA_MODEL_ENDPOINTS_JSON:-}
      SEGMENTATION_SERVICE_URL: ${SEGMENTATION_SERVICE_URL:-}
      SEGMENTATION_SERVICE_AUDIENCE: ${SEGMENTATION_SERVICE_AUDIENCE:-}
      SEGMENTATION_MODEL_ENDPOINTS_JSON: ${SEGMENTATION_MODEL_ENDPOINTS_JSON:-}
      IMAGE_SERVICE_URL: ${IMAGE_SERVICE_URL:-}
      IMAGE_SERVICE_AUDIENCE: ${IMAGE_SERVICE_AUDIENCE:-}
      IIIF_BASE: ${IIIF_BASE:-/iiif/3}
      IIIF_INTERNAL_BASE: ${IIIF_INTERNAL_BASE:-http://triplet:8080/iiif/3}
      TRIPLET_PRESENTATION_BASE: ${TRIPLET_PRESENTATION_BASE-http://localhost:8081/presentation/v3}
      TRIPLET_PRESENTATION_INTERNAL_BASE: ${TRIPLET_PRESENTATION_INTERNAL_BASE-http://triplet:8080/presentation/v3}
      TRIPLET_PRESENTATION_WRITE_TOKEN: ${TRIPLET_PRESENTATION_WRITE_TOKEN-scribe-local-presentation-token}
      TRANSCRIPTION_QUEUE_BACKEND: ${TRANSCRIPTION_QUEUE_BACKEND:-database}
      PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID:-}
      PUBSUB_TRANSCRIPTION_TOPIC_ID: ${PUBSUB_TRANSCRIPTION_TOPIC_ID:-scribe-transcription-jobs}
      PUBSUB_TRANSCRIPTION_SUBSCRIPTION_ID: ${PUBSUB_TRANSCRIPTION_SUBSCRIPTION_ID:-scribe-transcription-workers}
      SCRIBE_UPLOADS_BUCKET: ${SCRIBE_UPLOADS_BUCKET:-}
      SCRIBE_UPLOADS_PREFIX: ${SCRIBE_UPLOADS_PREFIX:-uploads}
      KRAKEN_MODEL_ENDPOINTS_JSON: ${KRAKEN_MODEL_ENDPOINTS_JSON:-}
    volumes:
      - ./config.yaml:/etc/scribe/config.yaml:ro
      - uploads-data:/app/uploads
      - cache-data:/app/cache
    secrets:
      - GOOGLE_APPLICATION_CREDENTIALS
    depends_on:
      mariadb:
        condition: service_healthy
      triplet:
        condition: service_started

  image-service:
    image: ${SCRIBE_IMAGE_SERVICE_IMAGE:-ghcr.io/lehigh-university-libraries/scribe-image-service:main@sha256:9f608b9084dc5f22cae883c73591361ba6cabf880c4c2413bc084a40b5a1145d}
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/GOOGLE_APPLICATION_CREDENTIALS
      IMAGE_SERVICE_UPLOADS_DIR: /app/uploads
      SCRIBE_UPLOADS_BUCKET: ${SCRIBE_UPLOADS_BUCKET:-}
      SCRIBE_UPLOADS_PREFIX: ${SCRIBE_UPLOADS_PREFIX:-uploads}
    volumes:
      - uploads-data:/app/uploads
    secrets:
      - GOOGLE_APPLICATION_CREDENTIALS

  worker:
    image: ${SCRIBE_API_IMAGE:-ghcr.io/lehigh-university-libraries/scribe:main}
    build: .
    command: ["/app/scribe-worker"]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/GOOGLE_APPLICATION_CREDENTIALS
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      VAULT_ADDRESS: ${VAULT_ADDRESS:-}
      VAULT_WORKSPACE: ${VAULT_WORKSPACE:-dev}
      VAULT_SECRET_PREFIX: ${VAULT_SECRET_PREFIX:-scribe/dev}
      VAULT_GCP_AUTH_ROLE: ${VAULT_GCP_AUTH_ROLE:-scribe-app}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      OLLAMA_AUDIENCE: ${OLLAMA_AUDIENCE:-}
      OLLAMA_MODEL_ENDPOINTS_JSON: ${OLLAMA_MODEL_ENDPOINTS_JSON:-}
      SEGMENTATION_SERVICE_URL: ${SEGMENTATION_SERVICE_URL:-}
      SEGMENTATION_SERVICE_AUDIENCE: ${SEGMENTATION_SERVICE_AUDIENCE:-}
      SEGMENTATION_MODEL_ENDPOINTS_JSON: ${SEGMENTATION_MODEL_ENDPOINTS_JSON:-}
      IMAGE_SERVICE_URL: ${IMAGE_SERVICE_URL:-}
      IMAGE_SERVICE_AUDIENCE: ${IMAGE_SERVICE_AUDIENCE:-}
      IIIF_BASE: ${IIIF_BASE:-/iiif/3}
      IIIF_INTERNAL_BASE: ${IIIF_INTERNAL_BASE:-http://triplet:8080/iiif/3}
      TRIPLET_PRESENTATION_BASE: ${TRIPLET_PRESENTATION_BASE-http://localhost:8081/presentation/v3}
      TRIPLET_PRESENTATION_INTERNAL_BASE: ${TRIPLET_PRESENTATION_INTERNAL_BASE-http://triplet:8080/presentation/v3}
      TRIPLET_PRESENTATION_WRITE_TOKEN: ${TRIPLET_PRESENTATION_WRITE_TOKEN-scribe-local-presentation-token}
      TRANSCRIPTION_QUEUE_BACKEND: ${TRANSCRIPTION_QUEUE_BACKEND:-database}
      PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID:-}
      PUBSUB_TRANSCRIPTION_TOPIC_ID: ${PUBSUB_TRANSCRIPTION_TOPIC_ID:-scribe-transcription-jobs}
      PUBSUB_TRANSCRIPTION_SUBSCRIPTION_ID: ${PUBSUB_TRANSCRIPTION_SUBSCRIPTION_ID:-scribe-transcription-workers}
      SCRIBE_UPLOADS_BUCKET: ${SCRIBE_UPLOADS_BUCKET:-}
      SCRIBE_UPLOADS_PREFIX: ${SCRIBE_UPLOADS_PREFIX:-uploads}
      KRAKEN_MODEL_ENDPOINTS_JSON: ${KRAKEN_MODEL_ENDPOINTS_JSON:-}
    volumes:
      - ./config.yaml:/etc/scribe/config.yaml:ro
      - uploads-data:/app/uploads
      - cache-data:/app/cache
    secrets:
      - GOOGLE_APPLICATION_CREDENTIALS
    depends_on:
      mariadb:
        condition: service_healthy
      api:
        condition: service_started
      triplet:
        condition: service_started

  triplet:
    image: ghcr.io/libops/triplet:v1.1.2@sha256:da42e55c265af7c02d4351e8ea97aa249c6b354b837a03f8c7c372241b1126df
    environment:
      TRIPLET_PUBLIC_BASE_URL: ${TRIPLET_PUBLIC_BASE_URL:-http://localhost:8081}
      TRIPLET_PRESENTATION_WRITE_TOKEN: ${TRIPLET_PRESENTATION_WRITE_TOKEN:-scribe-local-presentation-token}
    volumes:
      - ./triplet.config.yaml:/etc/triplet/config.yaml:ro
      - uploads-data:/var/lib/triplet/images
      - triplet-presentation-data:/var/lib/triplet/presentation
      - triplet-cache-data:/var/lib/triplet/cache

  vault-init:
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    profiles: ["init"]
    environment:
      VAULT_ADDRESS: ${VAULT_ADDRESS:-}
      VAULT_GCP_AUTH_ROLE: ${VAULT_GCP_AUTH_ROLE:-scribe-app}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-secret}
      VAULT_SECRET_PREFIX: ${VAULT_SECRET_PREFIX:-scribe/dev}
      VAULT_DATABASE_APP_PATH: ${VAULT_DATABASE_APP_PATH:-scribe/dev/database/app}
      VAULT_DATABASE_ROOT_PATH: ${VAULT_DATABASE_ROOT_PATH:-scribe/dev/database/root}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/GOOGLE_APPLICATION_CREDENTIALS
      OUT_DIR: /out
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
    secrets:
      - GOOGLE_APPLICATION_CREDENTIALS
    volumes:
      - ./secrets:/out
      - ./scripts/vault-init.sh:/usr/local/bin/vault-init.sh:ro
    entrypoint:
      - /bin/sh
      - /usr/local/bin/vault-init.sh
    restart: "no"

volumes:
  mariadb-data:
  uploads-data:
  cache-data:
  triplet-presentation-data:
  triplet-cache-data:

secrets:
  GOOGLE_APPLICATION_CREDENTIALS:
    file: ./secrets/GOOGLE_APPLICATION_CREDENTIALS
  mariadb_password:
    file: ./secrets/mariadb_password
  mariadb_root_password:
    file: ./secrets/mariadb_root_password
