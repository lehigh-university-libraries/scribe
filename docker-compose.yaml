services:
  mariadb:
    image: mariadb:12.2@sha256:e0236fc6386e7eacd9359e59d0a078bd7aa0d18280d36d13061121bedeaee903
    environment:
      MARIADB_DATABASE: scribe
      MARIADB_USER: scribe
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
    volumes:
      - mariadb-data:/var/lib/mysql
    secrets:
      - mariadb_password
      - mariadb_root_password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${SCRIBE_API_IMAGE:-ghcr.io/lehigh-university-libraries/scribe:main}
    build: .
    ports:
      - "${SCRIBE_API_PORT:-80}:8080"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/GOOGLE_APPLICATION_CREDENTIALS
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      VAULT_ADDRESS: ${VAULT_ADDRESS:-}
      VAULT_GCP_AUTH_ROLE: ${VAULT_GCP_AUTH_ROLE:-scribe-app}
      CANTALOUPE_IIIF_INTERNAL_BASE: ${CANTALOUPE_IIIF_INTERNAL_BASE:-http://cantaloupe:8182/iiif/2}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      OLLAMA_AUDIENCE: ${OLLAMA_AUDIENCE:-}
      OLLAMA_MODEL_ENDPOINTS_JSON: ${OLLAMA_MODEL_ENDPOINTS_JSON:-}
      SEGMENTATION_SERVICE_URL: ${SEGMENTATION_SERVICE_URL:-}
      SEGMENTATION_SERVICE_AUDIENCE: ${SEGMENTATION_SERVICE_AUDIENCE:-}
      SEGMENTATION_MODEL_ENDPOINTS_JSON: ${SEGMENTATION_MODEL_ENDPOINTS_JSON:-}
      IMAGE_SERVICE_URL: ${IMAGE_SERVICE_URL:-}
      IMAGE_SERVICE_AUDIENCE: ${IMAGE_SERVICE_AUDIENCE:-}
      KRAKEN_MODEL_ENDPOINTS_JSON: ${KRAKEN_MODEL_ENDPOINTS_JSON:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
    volumes:
      - ./config.yaml:/etc/scribe/config.yaml:ro
      - uploads-data:/app/uploads
      - cache-data:/app/cache
    secrets:
      - GOOGLE_APPLICATION_CREDENTIALS
    depends_on:
      mariadb:
        condition: service_healthy

  worker:
    image: ${SCRIBE_API_IMAGE:-ghcr.io/lehigh-university-libraries/scribe:main}
    build: .
    command: ["/app/scribe-worker"]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/GOOGLE_APPLICATION_CREDENTIALS
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      VAULT_ADDRESS: ${VAULT_ADDRESS:-}
      VAULT_GCP_AUTH_ROLE: ${VAULT_GCP_AUTH_ROLE:-scribe-app}
      CANTALOUPE_IIIF_INTERNAL_BASE: ${CANTALOUPE_IIIF_INTERNAL_BASE:-http://cantaloupe:8182/iiif/2}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      OLLAMA_AUDIENCE: ${OLLAMA_AUDIENCE:-}
      OLLAMA_MODEL_ENDPOINTS_JSON: ${OLLAMA_MODEL_ENDPOINTS_JSON:-}
      SEGMENTATION_SERVICE_URL: ${SEGMENTATION_SERVICE_URL:-}
      SEGMENTATION_SERVICE_AUDIENCE: ${SEGMENTATION_SERVICE_AUDIENCE:-}
      SEGMENTATION_MODEL_ENDPOINTS_JSON: ${SEGMENTATION_MODEL_ENDPOINTS_JSON:-}
      IMAGE_SERVICE_URL: ${IMAGE_SERVICE_URL:-}
      IMAGE_SERVICE_AUDIENCE: ${IMAGE_SERVICE_AUDIENCE:-}
      KRAKEN_MODEL_ENDPOINTS_JSON: ${KRAKEN_MODEL_ENDPOINTS_JSON:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
    volumes:
      - ./config.yaml:/etc/scribe/config.yaml:ro
      - uploads-data:/app/uploads
      - cache-data:/app/cache
    secrets:
      - GOOGLE_APPLICATION_CREDENTIALS
    depends_on:
      mariadb:
        condition: service_healthy
      api:
        condition: service_started

  cantaloupe:
    image: islandora/cantaloupe:6@sha256:8716969a1cc952210f0ef42f01f2c6e13175c15a449ac15d6652a5b44fc39e86
    environment:
      CANTALOUPE_SOURCE_STATIC: FilesystemSource
      CANTALOUPE_FILESYSTEMSOURCE_LOOKUP_STRATEGY: BasicLookupStrategy
      CANTALOUPE_FILESYSTEMSOURCE_BASICLOOKUPSTRATEGY_PATH_PREFIX: /uploads/
      CANTALOUPE_ENDPOINT_IIIF_2_ENABLED: "true"
      CANTALOUPE_ENDPOINT_IIIF_3_ENABLED: "true"
      CANTALOUPE_HTTP_PORT: "8182"
    volumes:
      - uploads-data:/uploads:ro
      - cantaloupe-data:/data

  vault-init:
    image: alpine:3.23@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
    profiles: ["init"]
    environment:
      VAULT_ADDRESS: ${VAULT_ADDRESS:-}
      VAULT_GCP_AUTH_ROLE: ${VAULT_GCP_AUTH_ROLE:-scribe-app}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-secret}
      VAULT_DATABASE_PATH: ${VAULT_DATABASE_PATH:-scribe/database}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/GOOGLE_APPLICATION_CREDENTIALS
      OUT_DIR: /out
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
    secrets:
      - GOOGLE_APPLICATION_CREDENTIALS
    volumes:
      - ./secrets:/out
      - ./scripts/vault-init.sh:/usr/local/bin/vault-init.sh:ro
    entrypoint:
      - /bin/sh
      - /usr/local/bin/vault-init.sh
    restart: "no"

volumes:
  mariadb-data:
  uploads-data:
  cache-data:
  cantaloupe-data:

secrets:
  GOOGLE_APPLICATION_CREDENTIALS:
    file: ./secrets/GOOGLE_APPLICATION_CREDENTIALS
  mariadb_password:
    file: ./secrets/mariadb_password
  mariadb_root_password:
    file: ./secrets/mariadb_root_password
