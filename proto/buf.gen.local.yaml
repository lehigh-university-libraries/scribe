version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/lehigh-university-libraries/scribe/proto
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: .
    opt:
      - paths=source_relative
