syntax = "proto3";

package scribe.v1;

import "buf/validate/validate.proto";
import "scribe/v1/options/v1/auth.proto";

option go_package = "github.com/lehigh-university-libraries/scribe/proto/scribe/v1;scribev1";

// ProcessImageURLRequest imports and schedules one image fetched from an
// external URL. Retries must reuse idempotency_key.
message ProcessImageURLRequest {
  string image_url = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: ".*\\S.*"
      max_len: 2048
    }
  ];
  reserved 2;
  reserved "output_format";
  // If set, uses this context; otherwise selection engine runs against metadata.
  uint64 context_id = 3;
  // Optional metadata JSON passed to the selection engine.
  string metadata = 4 [(buf.validate.field).string = {
    pattern: "^$|.*\\S.*"
    max_bytes: 1048576
  }];
  string idempotency_key = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];
  // Stable repository identifier used to correlate the created Scribe item.
  string external_reference_id = 6 [(buf.validate.field).string = {
    pattern: "^$|.*\\S.*"
    max_len: 512
  }];
}

message ProcessHOCRRequest {
  option (buf.validate.message).cel = {
    id: "process_hocr.image_source"
    message: "exactly one of image_url or image_data is required"
    expression: "this.image_url.matches('.*\\\\S.*') != (size(this.image_data) > 0)"
  };
  string hocr = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: ".*\\S.*"
      max_bytes: 10485760
    }
  ];
  string image_url = 2 [(buf.validate.field).string = {
    pattern: "^$|.*\\S.*"
    max_len: 2048
  }];
  reserved 3;
  reserved "output_format";
  bytes image_data = 4 [(buf.validate.field).bytes.max_len = 104857600];
  string filename = 5 [(buf.validate.field).string = {
    pattern: "^$|.*\\S.*"
    max_len: 255
  }];
  string idempotency_key = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];
  // Optional metadata JSON retained on the created item and echoed by
  // item-scoped completion, failure, and publication events.
  string metadata = 7 [(buf.validate.field).string = {
    pattern: "^$|.*\\S.*"
    max_bytes: 1048576
  }];
  // Stable repository identifier used to correlate the created Scribe item.
  string external_reference_id = 8 [(buf.validate.field).string = {
    pattern: "^$|.*\\S.*"
    max_len: 512
  }];
}

// ProcessImageURLResponse returns item/image IDs along with run-scoped OCR data.
message ProcessImageURLResponse {
  string item_id = 1;
  uint64 item_image_id = 2;
  string image_url = 3;
  string hocr = 4;
  string plain_text = 5;
  // Stable OCR provenance-run identifier. This is not an authentication or
  // browser editor session identifier.
  string session_id = 6;
  // Durable asynchronous transcription job. Zero means the imported result is
  // already complete and no asynchronous transcription was scheduled.
  uint64 transcription_job_id = 7;
}

message ProcessHOCRResponse {
  string item_id = 1;
  uint64 item_image_id = 2;
  string image_url = 3;
  string hocr = 4;
  string plain_text = 5;
  // Stable OCR provenance-run identifier. This is not an authentication or
  // browser editor session identifier.
  string session_id = 6;
  // Durable asynchronous transcription job. ProcessHOCR is synchronous and
  // normally returns zero because the supplied hOCR is the completed result.
  uint64 transcription_job_id = 7;
}

message GetOCRRunRequest {
  option (buf.validate.message).cel = {
    id: "get_ocr_run.identifier"
    message: "item_image_id is required"
    expression: "this.item_image_id > 0"
  };
  uint64 item_image_id = 2;
}

message GetOCRRunResponse {
  string session_id = 1;
  uint64 item_image_id = 2;
  string image_url = 3;
  string model = 4;
  string original_hocr = 5;
  string original_text = 6;
  reserved 7, 8, 9;
  reserved "corrected_hocr", "corrected_text", "edit_count";
  int32 levenshtein_distance = 10;
  uint64 context_id = 11;
  // Revision of the canonical AnnotationPage used for this metric. Zero means
  // the baseline OCR has not yet been corrected through the page API.
  uint64 canonical_revision = 12;
}

message ReprocessItemImageRequest {
  uint64 item_image_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
  // Explicit processing context, or zero to resolve the workspace/default
  // context before reserving provider work.
  uint64 context_id = 2;
  // Exact canonical AnnotationPage revision the caller reviewed. This is both
  // the optimistic-concurrency fence and the stable operation identity used to
  // deduplicate retries before invoking an expensive segmentation provider.
  uint64 expected_revision = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
}

message ReprocessItemImageResponse {
  string session_id = 1;
  uint64 item_image_id = 2;
  uint64 context_id = 3;
  string image_url = 4;
  string hocr = 5;
  string plain_text = 6;
  string provider = 7;
  string model = 8;
  // Durable successor job created in the same transaction as the new baseline.
  uint64 transcription_job_id = 9;
  // Canonical AnnotationPage revision committed by this operation.
  uint64 canonical_revision = 10;
}

service ImageProcessingService {
  rpc ProcessImageURL(ProcessImageURLRequest) returns (ProcessImageURLResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_USER
      level: ACCESS_LEVEL_WRITE
    };
  }
  rpc ProcessHOCR(ProcessHOCRRequest) returns (ProcessHOCRResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_USER
      level: ACCESS_LEVEL_WRITE
    };
  }
  rpc GetOCRRun(GetOCRRunRequest) returns (GetOCRRunResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_ITEM_IMAGE
      level: ACCESS_LEVEL_READ
      resource_id_field: "item_image_id"
    };
  }
  rpc ReprocessItemImage(ReprocessItemImageRequest) returns (ReprocessItemImageResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_ITEM_IMAGE
      level: ACCESS_LEVEL_WRITE
      resource_id_field: "item_image_id"
    };
  }
}
