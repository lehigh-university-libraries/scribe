syntax = "proto3";

package scribe.v1;

import "buf/validate/validate.proto";
import "scribe/v1/options/v1/auth.proto";

option go_package = "github.com/lehigh-university-libraries/scribe/proto/scribe/v1;scribev1";

message AuthUser {
  uint64 id = 1;
  string email = 2;
  string name = 3;
  string picture_url = 4;
  bool is_admin = 5;
  uint64 default_workspace_id = 6;
}

message AuthWorkspace {
  uint64 id = 1;
  string name = 2;
  string role = 3;
}

message GetAuthMeRequest {}

message GetAuthMeResponse {
  bool authenticated = 1;
  string auth_type = 2;
  string login_url = 3;
  string logout_url = 4;
  AuthUser user = 5;
  AuthWorkspace workspace = 6;
}

message APIKeyRecord {
  reserved 8;
  uint64 id = 1;
  uint64 workspace_id = 2;
  uint64 created_by_user_id = 3;
  string name = 4;
  string key_prefix = 5;
  string role = 6;
  repeated string scopes = 7;
  string expires_at = 9;
  string created_at = 10;
  string updated_at = 11;
}

message ListAPIKeysRequest {}

message ListAPIKeysResponse {
  repeated APIKeyRecord api_keys = 1;
}

message CreateAPIKeyRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: ".*\\S.*"
      max_len: 255
    }
  ];
  string role = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: "^(admin|write|create|read)$"
      max_len: 6
    }
  ];
  repeated string scopes = 3 [(buf.validate.field).repeated = {
    max_items: 32
    unique: true
    items: {
      string: {
        pattern: "^(\\*|[a-z_]+:[a-z_*]+)$"
        max_len: 64
      }
    }
  }];
  string expires_at = 4 [(buf.validate.field).string.max_len = 40];
}

message CreateAPIKeyResponse {
  APIKeyRecord api_key = 1;
  string key = 2;
}

message DeleteAPIKeyRequest {
  uint64 key_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
}

message DeleteAPIKeyResponse {}

message ProviderSecretRecord {
  uint64 id = 1;
  uint64 user_id = 2;
  uint64 workspace_id = 3;
  string provider = 4;
  string name = 5;
  string key_hint = 6;
  string scope = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListProviderSecretsRequest {}

message ListProviderSecretsResponse {
  repeated ProviderSecretRecord provider_secrets = 1;
}

message CreateProviderSecretRequest {
  string provider = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: "^[a-z][a-z0-9_-]{0,63}$"
      max_len: 64
    }
  ];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: ".*\\S.*"
      max_len: 255
    }
  ];
  string api_key = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: ".*\\S.*"
      min_len: 8
      max_len: 8192
    }
  ];
  string scope = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: "^(user|workspace)$"
      max_len: 9
    }
  ];
}

message CreateProviderSecretResponse {
  ProviderSecretRecord provider_secret = 1;
}

message DeleteProviderSecretRequest {
  uint64 secret_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
}

message DeleteProviderSecretResponse {}

service AuthService {
  rpc GetAuthMe(GetAuthMeRequest) returns (GetAuthMeResponse) {
    option (scribe.v1.options.v1.authz) = {
      allow_anonymous: true
      resource: RESOURCE_TYPE_USER
      level: ACCESS_LEVEL_READ
    };
  }
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_USER
      level: ACCESS_LEVEL_ADMIN
      session_only: true
    };
  }
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_USER
      level: ACCESS_LEVEL_ADMIN
      session_only: true
    };
  }
  rpc DeleteAPIKey(DeleteAPIKeyRequest) returns (DeleteAPIKeyResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_API_KEY
      level: ACCESS_LEVEL_ADMIN
      resource_id_field: "key_id"
      session_only: true
    };
  }
  rpc ListProviderSecrets(ListProviderSecretsRequest) returns (ListProviderSecretsResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_USER
      level: ACCESS_LEVEL_READ
      session_only: true
    };
  }
  rpc CreateProviderSecret(CreateProviderSecretRequest) returns (CreateProviderSecretResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_USER
      level: ACCESS_LEVEL_WRITE
      session_only: true
    };
  }
  rpc DeleteProviderSecret(DeleteProviderSecretRequest) returns (DeleteProviderSecretResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_PROVIDER_SECRET
      level: ACCESS_LEVEL_WRITE
      resource_id_field: "secret_id"
      session_only: true
    };
  }
}
