syntax = "proto3";

package scribe.v1;

import "buf/validate/validate.proto";
import "scribe/v1/options/v1/auth.proto";

option go_package = "github.com/lehigh-university-libraries/scribe/proto/scribe/v1;scribev1";

// Context bundles all processing parameters for a pipeline run.
message Context {
  uint64 id = 1;
  // Creator user for workspace-owned contexts; 0 means system context.
  uint64 user_id = 2;
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: ".*\\S.*"
      max_len: 255
    }
  ];
  string description = 4 [(buf.validate.field).string = {
    pattern: "^$|.*\\S.*"
    max_len: 4096
  }];
  bool is_default = 5;
  // Segmentation model: "tesseract" | "scribe" | "kraken:<model-id>"
  string segmentation_model = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: "^[a-z0-9][a-z0-9._:-]{0,254}$"
      max_len: 255
    }
  ];
  reserved 7, 12, 15, 16;
  reserved "image_preprocessors", "post_processing_steps", "transcription_base_url", "transcription_audience";
  string transcription_provider = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: "^[a-z][a-z0-9_-]{0,63}$"
      max_len: 64
    }
  ];
  string transcription_model = 9 [(buf.validate.field).string = {
    pattern: "^$|.*\\S.*"
    max_len: 255
  }];
  optional double temperature = 10 [(buf.validate.field).double = {
    gte: 0
    lte: 2
  }];
  string system_prompt = 11 [(buf.validate.field).string = {
    pattern: "^$|.*\\S.*"
    max_len: 8192
  }];
  string created_at = 13;
  string updated_at = 14;
}

// ModelDescriptor is a server-approved model that can be selected by a context.
message ModelDescriptor {
  string id = 1;
  string label = 2;
  bool is_default = 3;
  bool supports_temperature = 4;
}

// ProviderDescriptor describes one installed transcription provider. Endpoint
// and credential details intentionally remain server-owned.
message ProviderDescriptor {
  reserved 6;
  reserved "supports_temperature";
  string id = 1;
  string label = 2;
  repeated ModelDescriptor models = 3;
  bool requires_api_key = 4;
  bool supports_system_prompt = 5;
}

// RuleCondition is a single AND-clause predicate.
message RuleCondition {
  option (buf.validate.message).cel = {
    id: "rule_condition.operator"
    message: "operator must be one of eq, neq, contains, starts_with, or ends_with"
    expression: "this.operator == 'eq' || this.operator == 'neq' || this.operator == 'contains' || this.operator == 'starts_with' || this.operator == 'ends_with'"
  };
  string field = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: ".*\\S.*"
      max_bytes: 255
    }
  ];
  // eq | neq | contains | starts_with | ends_with
  string operator = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: ".*\\S.*"
      max_len: 16
    }
  ];
  string value = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: ".*\\S.*"
      max_bytes: 4096
    }
  ];
}

// ContextSelectionRule maps a set of AND conditions to a context.
// The engine evaluates rules ordered by priority (descending); the first
// fully-matching rule wins. If no rule matches, the default context is used.
message ContextSelectionRule {
  uint64 id = 1;
  uint64 context_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
  int32 priority = 3;
  repeated RuleCondition conditions = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 32
  }];
}

// --- requests / responses ---

message ListContextsRequest {
  // If true, only return system contexts.
  bool system_only = 1;
  // Number of contexts to return. Zero uses the server default of 50.
  uint32 page_size = 2 [(buf.validate.field).uint32.lte = 100];
  // Opaque workspace- and filter-bound continuation token.
  string page_token = 3 [(buf.validate.field).string.max_len = 512];
}

message ListContextsResponse {
  repeated Context contexts = 1;
  // Empty when the workspace context catalog is exhausted.
  string next_page_token = 2;
}

message GetContextRequest {
  uint64 context_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
}

message GetContextResponse {
  Context context = 1;
}

message CreateContextRequest {
  Context context = 1 [(buf.validate.field).required = true];
}

message CreateContextResponse {
  Context context = 1;
}

message UpdateContextRequest {
  option (buf.validate.message).cel = {
    id: "update_context.id"
    message: "context.id is required"
    expression: "has(this.context) && this.context.id > 0"
  };
  Context context = 1 [(buf.validate.field).required = true];
}

message UpdateContextResponse {
  Context context = 1;
}

message DeleteContextRequest {
  uint64 context_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
}

message DeleteContextResponse {}

message ListSelectionRulesRequest {
  // Filter by context; 0 = all rules
  uint64 context_id = 1;
  // Number of rules to return. Zero uses the server default of 50.
  uint32 page_size = 2 [(buf.validate.field).uint32.lte = 100];
  // Opaque workspace- and context-filter-bound continuation token.
  string page_token = 3 [(buf.validate.field).string.max_len = 512];
}

message ListSelectionRulesResponse {
  repeated ContextSelectionRule rules = 1;
  // Empty when the filtered rule catalog is exhausted.
  string next_page_token = 2;
}

message CreateSelectionRuleRequest {
  ContextSelectionRule rule = 1 [(buf.validate.field).required = true];
}

message CreateSelectionRuleResponse {
  ContextSelectionRule rule = 1;
}

message DeleteSelectionRuleRequest {
  uint64 rule_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
}

message DeleteSelectionRuleResponse {}

// ResolveContextRequest asks the selection engine to pick the right context
// for a given metadata bag (JSON object as string).
message ResolveContextRequest {
  // Flat JSON object with at most 64 scalar fields. Field names are capped at
  // 255 bytes and string/number representations at 4096 bytes.
  string metadata_json = 1 [(buf.validate.field).string.max_bytes = 65536];
}

message ResolveContextResponse {
  Context context = 1;
  bool is_default = 2;
}

message GetModelCatalogRequest {}

message GetModelCatalogResponse {
  repeated ProviderDescriptor transcription_providers = 1;
  repeated ModelDescriptor segmentation_models = 2;
}

// ContextMetrics summarizes correction effort against the immutable OCR
// baseline. Canonical AnnotationPage revisions are the only correction source.
message ContextMetrics {
  uint64 context_id = 1;
  uint64 total_runs = 2;
  uint64 corrected_runs = 3;
  double avg_levenshtein_distance = 4;
}

message GetContextMetricsRequest {
  uint64 context_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
}

message GetContextMetricsResponse {
  ContextMetrics metrics = 1;
}

service ContextService {
  rpc ListContexts(ListContextsRequest) returns (ListContextsResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_USER
      level: ACCESS_LEVEL_READ
    };
  }
  rpc GetContext(GetContextRequest) returns (GetContextResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_CONTEXT
      level: ACCESS_LEVEL_READ
      resource_id_field: "context_id"
    };
  }
  rpc CreateContext(CreateContextRequest) returns (CreateContextResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_USER
      level: ACCESS_LEVEL_WRITE
    };
  }
  rpc UpdateContext(UpdateContextRequest) returns (UpdateContextResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_CONTEXT
      level: ACCESS_LEVEL_WRITE
      resource_id_field: "context.id"
    };
  }
  rpc DeleteContext(DeleteContextRequest) returns (DeleteContextResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_CONTEXT
      level: ACCESS_LEVEL_WRITE
      resource_id_field: "context_id"
    };
  }

  rpc ListSelectionRules(ListSelectionRulesRequest) returns (ListSelectionRulesResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_USER
      level: ACCESS_LEVEL_READ
    };
  }
  rpc CreateSelectionRule(CreateSelectionRuleRequest) returns (CreateSelectionRuleResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_CONTEXT
      level: ACCESS_LEVEL_WRITE
      resource_id_field: "rule.context_id"
    };
  }
  rpc DeleteSelectionRule(DeleteSelectionRuleRequest) returns (DeleteSelectionRuleResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_SELECTION_RULE
      level: ACCESS_LEVEL_WRITE
      resource_id_field: "rule_id"
    };
  }

  rpc ResolveContext(ResolveContextRequest) returns (ResolveContextResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_USER
      level: ACCESS_LEVEL_READ
    };
  }

  rpc GetModelCatalog(GetModelCatalogRequest) returns (GetModelCatalogResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_USER
      level: ACCESS_LEVEL_READ
    };
  }

  rpc GetContextMetrics(GetContextMetricsRequest) returns (GetContextMetricsResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_CONTEXT
      level: ACCESS_LEVEL_READ
      resource_id_field: "context_id"
    };
  }
}
