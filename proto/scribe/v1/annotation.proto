syntax = "proto3";

package scribe.v1;

import "buf/validate/validate.proto";
import "scribe/v1/options/v1/auth.proto";

option go_package = "github.com/lehigh-university-libraries/scribe/proto/scribe/v1;scribev1";

// AnnotationService handles IIIF Presentation 3 annotation storage and
// annotation enrichment operations on the main API server.

enum AnnotationGranularity {
  ANNOTATION_GRANULARITY_UNSPECIFIED = 0;
  ANNOTATION_GRANULARITY_ALL = 1;
  ANNOTATION_GRANULARITY_PAGE = 2;
  ANNOTATION_GRANULARITY_BLOCK = 3;
  ANNOTATION_GRANULARITY_PARAGRAPH = 4;
  ANNOTATION_GRANULARITY_LINE = 5;
  ANNOTATION_GRANULARITY_WORD = 6;
  ANNOTATION_GRANULARITY_GLYPH = 7;
}

message SearchAnnotationsRequest {
  // item_image_id is the canonical, tenant-scoped resource identifier.
  uint64 item_image_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
  // Optional interoperability consistency check. The value is treated as an
  // opaque Canvas ID and must match the item's stored target; it is never a
  // lookup or authorization key.
  string canvas_uri = 2 [(buf.validate.field).string = {
    pattern: "^$|.*\\S.*"
    max_len: 2048
  }];
  AnnotationGranularity granularity = 3;
}

message SearchAnnotationsResponse {
  // Full IIIF AnnotationPage JSON, serialised as string for round-trip fidelity.
  string annotation_page_json = 1;
  uint64 revision = 2;
}

// GetAnnotationPageRequest loads the canonical IIIF Presentation 3
// AnnotationPage for one item image.
message GetAnnotationPageRequest {
  uint64 item_image_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
}

message GetAnnotationPageResponse {
  uint64 item_image_id = 1;
  string canvas_uri = 2;
  string annotation_page_json = 3;
  uint64 revision = 4;
  string updated_at = 5;
}

// SaveAnnotationPageRequest atomically replaces one canonical page. A zero
// expected_revision creates the page; every subsequent save must provide the
// exact current revision.
message SaveAnnotationPageRequest {
  uint64 item_image_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
  string annotation_page_json = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = ".*\\S.*"
  ];
  uint64 expected_revision = 3;
}

message SaveAnnotationPageResponse {
  uint64 item_image_id = 1;
  string canvas_uri = 2;
  string annotation_page_json = 3;
  uint64 revision = 4;
  string updated_at = 5;
}

message GetAnnotationRequest {
  uint64 item_image_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
  // Complete canonical Scribe annotation ID from the current page.
  string id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = ".*\\S.*"
  ];
}

message GetAnnotationResponse {
  string annotation_json = 1;
}

message PublishItemImageEditsRequest {
  uint64 item_image_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
  // The draft revision the caller just saved. Publication fails explicitly if
  // a newer correction was committed before this transaction acquired its lock.
  uint64 expected_revision = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
}

message PublishItemImageEditsResponse {
  uint64 item_image_id = 1;
  string canvas_uri = 2;
  string annotation_page_json = 3;
  string published_at = 4;
  uint64 published_revision = 5;
  string public_url = 6;
}

// EnrichAnnotationRequest sends a IIIF annotation (one line or an entire
// AnnotationPage) to Scribe's transcription service for improvement.
// The caller provides the raw JSON and specifies the scope.
message EnrichAnnotationRequest {
  option (buf.validate.message).cel = {
    id: "enrich_annotation.scope"
    message: "item_image_id and annotation_json are required, and scope must be line or page"
    expression: "this.item_image_id > 0u && (this.scope == 'line' || this.scope == 'page') && this.annotation_json.matches('.*\\\\S.*')"
  };
  // Exact tenant-scoped image whose region will be transcribed. Canvas IDs are
  // targets/provenance and are not authorization or lookup keys.
  uint64 item_image_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
  // "line" = single Annotation JSON; "page" = full AnnotationPage JSON
  string scope = 2 [(buf.validate.field).string.pattern = ".*\\S.*"];
  string annotation_json = 3 [(buf.validate.field).string.pattern = ".*\\S.*"];
  // Optional: override context used for transcription
  uint64 context_id = 4;
}

message EnrichAnnotationResponse {
  string annotation_json = 1;
}

// Transform one selected line in a complete AnnotationPage into
// proportionally-spaced word annotations. If words is empty the selected
// line's text is tokenised on whitespace.
message SplitLineIntoWordsRequest {
  option (buf.validate.message).cel = {
    id: "split_line_into_words.selection"
    message: "item_image_id, annotation_page_json, and selected_annotation_id are required"
    expression: "this.item_image_id > 0u && this.annotation_page_json.matches('.*\\\\S.*') && this.selected_annotation_id.matches('.*\\\\S.*')"
  };
  uint64 item_image_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
  string annotation_page_json = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = ".*\\S.*"
  ];
  string selected_annotation_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = ".*\\S.*"
  ];
  repeated string words = 4 [(buf.validate.field).repeated = {
    max_items: 10000
    items: {
      string: {max_bytes: 16384}
    }
  }];
}

message SplitLineIntoWordsResponse {
  // Complete transformed AnnotationPage JSON.
  string annotation_page_json = 1;
}

// Transform every line in a complete AnnotationPage into a synchronized word
// view in one bounded server operation. Line annotations are retained; their
// derived word annotations replace any words already owned by those lines.
message SplitPageIntoWordsRequest {
  option (buf.validate.message).cel = {
    id: "split_page_into_words.page"
    message: "item_image_id and annotation_page_json are required"
    expression: "this.item_image_id > 0u && this.annotation_page_json.matches('.*\\\\S.*')"
  };
  uint64 item_image_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
  string annotation_page_json = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = ".*\\S.*"
  ];
}

message SplitPageIntoWordsResponse {
  // Complete transformed AnnotationPage JSON.
  string annotation_page_json = 1;
}

// Transform one selected line in a complete AnnotationPage into two lines at
// a word boundary.
message SplitLineIntoTwoLinesRequest {
  option (buf.validate.message).cel = {
    id: "split_line_into_two_lines.selection"
    message: "item_image_id, annotation_page_json, and selected_annotation_id are required"
    expression: "this.item_image_id > 0u && this.annotation_page_json.matches('.*\\\\S.*') && this.selected_annotation_id.matches('.*\\\\S.*')"
  };
  uint64 item_image_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
  string annotation_page_json = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = ".*\\S.*"
  ];
  string selected_annotation_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = ".*\\S.*"
  ];
  // 0 means split at midpoint.
  int32 split_at_word = 4 [(buf.validate.field).int32.gte = 0];
}

message SplitLineIntoTwoLinesResponse {
  // Complete transformed AnnotationPage JSON.
  string annotation_page_json = 1;
}

// Transform two or more selected lines in a complete AnnotationPage into one
// line (union bbox, concatenated text).
message JoinLinesRequest {
  option (buf.validate.message).cel = {
    id: "join_lines.selection"
    message: "item_image_id, annotation_page_json, and at least two non-empty selected_annotation_ids are required"
    expression: "this.item_image_id > 0u && this.annotation_page_json.matches('.*\\\\S.*') && this.selected_annotation_ids.size() >= 2 && this.selected_annotation_ids.all(id, id.matches('.*\\\\S.*'))"
  };
  uint64 item_image_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
  string annotation_page_json = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = ".*\\S.*"
  ];
  repeated string selected_annotation_ids = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).repeated = {
      min_items: 2
      max_items: 10000
      unique: true
    }
  ];
}

message JoinLinesResponse {
  // Complete transformed AnnotationPage JSON.
  string annotation_page_json = 1;
}

// Transform two or more selected word annotations in a complete
// AnnotationPage into one line annotation.
message JoinWordsIntoLineRequest {
  option (buf.validate.message).cel = {
    id: "join_words_into_line.selection"
    message: "item_image_id, annotation_page_json, and at least two non-empty selected_annotation_ids are required"
    expression: "this.item_image_id > 0u && this.annotation_page_json.matches('.*\\\\S.*') && this.selected_annotation_ids.size() >= 2 && this.selected_annotation_ids.all(id, id.matches('.*\\\\S.*'))"
  };
  uint64 item_image_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
  string annotation_page_json = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = ".*\\S.*"
  ];
  repeated string selected_annotation_ids = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).repeated = {
      min_items: 2
      max_items: 10000
      unique: true
    }
  ];
}

message JoinWordsIntoLineResponse {
  // Complete transformed AnnotationPage JSON.
  string annotation_page_json = 1;
}

// AnnotationExportFormat selects a rebuildable view of one committed canonical
// AnnotationPage. Export operations never accept caller-supplied annotation
// JSON, so every format is derived from the same tenant-owned revision.
enum AnnotationExportFormat {
  ANNOTATION_EXPORT_FORMAT_UNSPECIFIED = 0;
  ANNOTATION_EXPORT_FORMAT_PLAIN_TEXT = 1;
  ANNOTATION_EXPORT_FORMAT_HOCR = 2;
  ANNOTATION_EXPORT_FORMAT_PAGE_XML = 3;
  ANNOTATION_EXPORT_FORMAT_ALTO_XML = 4;
}

message ExportAnnotationPageRequest {
  option (buf.validate.message).cel = {
    id: "export_annotation_page.required"
    message: "item_image_id, expected_revision, and format are required"
    expression: "this.item_image_id > 0u && this.expected_revision > 0u && this.format != 0"
  };
  uint64 item_image_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
  // The exact committed revision to export. A stale value fails explicitly so
  // callers can never mistake a newer background result for their saved draft.
  uint64 expected_revision = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gt = 0
  ];
  AnnotationExportFormat format = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: 0
    }
  ];
}

message ExportAnnotationPageResponse {
  uint64 item_image_id = 1;
  uint64 revision = 2;
  string media_type = 3;
  bytes content = 4;
  string filename = 5;
}

service AnnotationService {
  rpc GetAnnotationPage(GetAnnotationPageRequest) returns (GetAnnotationPageResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_ITEM_IMAGE
      level: ACCESS_LEVEL_READ
      resource_id_field: "item_image_id"
    };
  }
  rpc SaveAnnotationPage(SaveAnnotationPageRequest) returns (SaveAnnotationPageResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_ITEM_IMAGE
      level: ACCESS_LEVEL_WRITE
      resource_id_field: "item_image_id"
    };
  }
  rpc SearchAnnotations(SearchAnnotationsRequest) returns (SearchAnnotationsResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_ITEM_IMAGE
      level: ACCESS_LEVEL_READ
      resource_id_field: "item_image_id"
    };
  }
  rpc GetAnnotation(GetAnnotationRequest) returns (GetAnnotationResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_ITEM_IMAGE
      level: ACCESS_LEVEL_READ
      resource_id_field: "item_image_id"
    };
  }
  rpc PublishItemImageEdits(PublishItemImageEditsRequest) returns (PublishItemImageEditsResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_ITEM_IMAGE
      level: ACCESS_LEVEL_WRITE
      resource_id_field: "item_image_id"
    };
  }
  // Improve transcription for one line or a full canvas.
  rpc EnrichAnnotation(EnrichAnnotationRequest) returns (EnrichAnnotationResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_ITEM_IMAGE
      level: ACCESS_LEVEL_WRITE
      resource_id_field: "item_image_id"
    };
  }

  // Structural split/join operations.
  rpc SplitLineIntoWords(SplitLineIntoWordsRequest) returns (SplitLineIntoWordsResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_ITEM_IMAGE
      level: ACCESS_LEVEL_WRITE
      resource_id_field: "item_image_id"
    };
  }
  rpc SplitPageIntoWords(SplitPageIntoWordsRequest) returns (SplitPageIntoWordsResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_ITEM_IMAGE
      level: ACCESS_LEVEL_WRITE
      resource_id_field: "item_image_id"
    };
  }
  rpc SplitLineIntoTwoLines(SplitLineIntoTwoLinesRequest) returns (SplitLineIntoTwoLinesResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_ITEM_IMAGE
      level: ACCESS_LEVEL_WRITE
      resource_id_field: "item_image_id"
    };
  }
  rpc JoinLines(JoinLinesRequest) returns (JoinLinesResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_ITEM_IMAGE
      level: ACCESS_LEVEL_WRITE
      resource_id_field: "item_image_id"
    };
  }
  rpc JoinWordsIntoLine(JoinWordsIntoLineRequest) returns (JoinWordsIntoLineResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_ITEM_IMAGE
      level: ACCESS_LEVEL_WRITE
      resource_id_field: "item_image_id"
    };
  }

  // Export one exact committed canonical revision to a rebuildable OCR view.
  rpc ExportAnnotationPage(ExportAnnotationPageRequest) returns (ExportAnnotationPageResponse) {
    option (scribe.v1.options.v1.authz) = {
      resource: RESOURCE_TYPE_ITEM_IMAGE
      level: ACCESS_LEVEL_READ
      resource_id_field: "item_image_id"
    };
  }
}
