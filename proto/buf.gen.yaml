version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/lehigh-university-libraries/scribe/proto
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: .
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: .
    opt:
      - paths=source_relative
  - remote: buf.build/bufbuild/es:v2.11.0
    out: ../web/src/proto
    opt:
      - target=ts
    include_imports: true
    include_wkt: true
  - remote: buf.build/community/sudorandom-connect-openapi:v0.21.3
    out: ../docs/api
    opt:
      - content-types=json
      - path=scribe.openapi.yaml
      - trim-unused-types
      - with-streaming
