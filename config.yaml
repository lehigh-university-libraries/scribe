listen_addr: ":8080"
public_base_url: "${PUBLIC_BASE_URL:-http://localhost:8080}"

auth:
  cookie_name: scribe_session
  cookie_domain: ""
  cookie_secure: auto
  session_ttl: 24h
  google_callback_path: /auth/callback/google
  allowed_domains: []
  denied_domains: []
  admin_emails: []

database:
  dsn_template: "{{.User}}:{{.Password}}@tcp({{.Host}}:{{.Port}})/{{.Name}}?parseTime=true"
  host: mariadb
  port: 3306
  name: scribe
  user: scribe

llm:
  provider: ollama
  default_system_prompt: ""
  segmentation_model: auto
  batch_size: 10
  line_transcribe_concurrency: 5
  ollama:
    url: "${OLLAMA_URL:-http://localhost:11434}"
    audience: "${OLLAMA_AUDIENCE:-}"
    model: "glm-ocr:bf16"
    models: ["glm-ocr:bf16", "llava", "bakllava"]
  kraken:
    url: "${KRAKEN_URL:-}"
    audience: "${KRAKEN_AUDIENCE:-}"
    model: "${KRAKEN_MODEL:-catmus-print-fondue-large.mlmodel}"
    models: ["catmus-print-fondue-large.mlmodel"]
  openai:
    model: "gpt-4o"
    models: ["gpt-4o", "gpt-4.1"]
  gemini:
    model: "gemini-2.0-flash"
    models: ["gemini-2.0-flash", "gemini-1.5-pro"]
    url_template: "https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s"

transcription:
  job_workers: 3

iiif:
  base: "${IIIF_BASE:-/iiif/3}"
  internal_base: "${IIIF_INTERNAL_BASE:-http://image-service:8080/iiif/3}"

segmentation_service:
  url: "${SEGMENTATION_SERVICE_URL:-}"
  audience: "${SEGMENTATION_SERVICE_AUDIENCE:-}"

image_service:
  url: "${IMAGE_SERVICE_URL:-}"
  audience: "${IMAGE_SERVICE_AUDIENCE:-}"

annotation:
  api_base: /
  api_internal_base: http://localhost:8080
  triplet_presentation_base: "${TRIPLET_PRESENTATION_BASE:-}"
  triplet_presentation_internal_base: "${TRIPLET_PRESENTATION_INTERNAL_BASE:-}"
  triplet_presentation_write_token: "${TRIPLET_PRESENTATION_WRITE_TOKEN:-}"

drupal:
  hocr_url_template: ""

webhooks:
  urls: []

vault:
  address: "${VAULT_ADDRESS:-}"
  gcp_auth_role: "${VAULT_GCP_AUTH_ROLE:-scribe-app}"
  kv_mount: secret
  paths:
    google_oauth: scribe/google_oauth
    openai: scribe/openai
    gemini: scribe/gemini
    database: scribe/database

# Deploy-time metadata for OCR Cloud Run services. Consumed by GitHub Actions
# (ci/ocr-matrix.sh) and Terraform (terraform/kraken.tf, terraform/ollama.tf)
# only. The runtime Go config ignores this section.
ocr:
  kraken:
    pip_spec: "kraken==7.0"
    default_segmentation_model: kraken
    default_transcription_model: catmus-print-fondue-large.mlmodel
    segmentation_models:
      kraken:
        file: blla.mlmodel
        doi: ""
    transcription_models:
      catmus-print-fondue-large.mlmodel:
        file: catmus-print-fondue-large.mlmodel
        doi: "10.5281/zenodo.10592716"
  ollama:
    base_image: "ollama/ollama:0.19.0@sha256:bf240c2847a8bc7b2c630b85dab5d1dedcba257b551d5fc9b290ce544d59272a"
    models:
      - glm-ocr:bf16
