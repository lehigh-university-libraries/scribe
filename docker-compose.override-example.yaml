services:
  frontend:
    image: ${SCRIBE_FRONTEND_IMAGE:-scribe-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:8888"
    environment:
      SCRIBE_FRONTEND_BACKEND_ORIGIN: http://api:8080
    depends_on:
      api:
        condition: service_started
