name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Terraform action to run.
        required: true
        type: choice
        default: apply
        options:
          - plan
          - apply
  push:
    branches:
      - main

concurrency:
  group: terraform-apply-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-backend-origin:
    runs-on: ubuntu-24.04
    outputs:
      backend_origin: ${{ steps.vars.outputs.backend_origin }}
      frontend_gar_image: ${{ steps.vars.outputs.frontend_gar_image }}
      frontend_gar_image_tag: ${{ steps.vars.outputs.frontend_gar_image_tag }}
    env:
      GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
      SCRIBE_ZONE: ${{ vars.SCRIBE_ZONE != '' && vars.SCRIBE_ZONE || 'us-east5-b' }}
    steps:
      - name: Validate workflow variables
        shell: bash
        run: |
          if [ -z "$GCLOUD_PROJECT" ]; then
            echo "GitHub Actions variable GCLOUD_PROJECT must be set." >&2
            exit 1
          fi
      - id: vars
        run: |
          echo "backend_origin=http://scribe.${SCRIBE_ZONE}.c.${GCLOUD_PROJECT}.internal" >> "$GITHUB_OUTPUT"
          echo "frontend_gar_image=us-docker.pkg.dev/${GCLOUD_PROJECT}/internal/scribe-frontend" >> "$GITHUB_OUTPUT"
          echo "frontend_gar_image_tag=us-docker.pkg.dev/${GCLOUD_PROJECT}/internal/scribe-frontend:main" >> "$GITHUB_OUTPUT"

  build-push:
    uses: lehigh-university-libraries/gha/.github/workflows/build-push-ghcr.yaml@0ad0a7d96a7b3a5c05ad811832108d67e3dea92c # main
    permissions:
      contents: read
      packages: write
    secrets: inherit

  build-frontend:
    needs: [prepare-backend-origin]
    uses: lehigh-university-libraries/gha/.github/workflows/build-push-ghcr.yaml@0ad0a7d96a7b3a5c05ad811832108d67e3dea92c # main
    permissions:
      id-token: write
      contents: read
      packages: write
    secrets: inherit
    with:
      image: scribe-frontend
      file: Dockerfile.frontend
      gar_image: ${{ needs.prepare-backend-origin.outputs.frontend_gar_image }}
      build_args: |
        SCRIBE_FRONTEND_BACKEND_ORIGIN=${{ needs.prepare-backend-origin.outputs.backend_origin }}
        SCRIBE_FRONTEND_IIIF_ORIGIN=${{ needs.prepare-backend-origin.outputs.backend_origin }}:8081

  build-ocr:
    uses: ./.github/workflows/build-ocr.yaml
    permissions:
      id-token: write
      contents: read
      packages: write
    secrets: inherit
    with:
      checkout_ref: ${{ github.sha }}
      workspace_slug: prod
      image_tag: main

  lint-test:
    uses: ./.github/workflows/lint-test.yaml
    permissions:
      contents: read
    secrets: inherit
    with:
      checkout_ref: ${{ github.sha }}

  terraform-apply:
    needs: [prepare-backend-origin, build-push, build-frontend, build-ocr, lint-test]
    uses: ./.github/workflows/terraform-deploy.yaml
    permissions:
      id-token: write
      contents: read
      packages: write
    secrets: inherit
    with:
      mode: ${{ github.event_name == 'push' && 'plan' || inputs.mode }}
      environment_name: production
      tf_workspace: prod
      site_name: scribe
      docker_compose_branch: main
      checkout_ref: ${{ github.sha }}
      run_snapshots: "true"
      push_image: false
      image_tag: ghcr.io/lehigh-university-libraries/scribe:main
      frontend_image_tag: ghcr.io/lehigh-university-libraries/scribe-frontend:main
      frontend_gar_image_tag: ${{ needs.prepare-backend-origin.outputs.frontend_gar_image_tag }}
      ocr_images_json: ${{ needs.build-ocr.outputs.images_json }}
