name: Terraform Apply

# Every push to main builds :main images and applies the prod workspace.
# A manual run can plan or apply without building.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run.
        required: true
        type: choice
        default: plan
        options: [plan, apply]

permissions:
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  lint-test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/lint-test.yaml
    permissions:
      contents: read

  images:
    if: github.event_name == 'push'
    needs: [lint-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}
          token_format: access_token
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            us-docker.pkg.dev/${{ vars.GCLOUD_PROJECT }}/internal/scribe:main
            us-docker.pkg.dev/${{ vars.GCLOUD_PROJECT }}/internal/scribe:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Build SQL-backed Triplet
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.triplet
          platforms: linux/amd64
          push: true
          tags: |
            us-docker.pkg.dev/${{ vars.GCLOUD_PROJECT }}/internal/scribe-triplet:main
            us-docker.pkg.dev/${{ vars.GCLOUD_PROJECT }}/internal/scribe-triplet:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: |
            us-docker.pkg.dev/${{ vars.GCLOUD_PROJECT }}/internal/scribe-frontend:main
            us-docker.pkg.dev/${{ vars.GCLOUD_PROJECT }}/internal/scribe-frontend:${{ github.sha }}
          build-args: |
            SCRIBE_FRONTEND_BACKEND_ORIGIN=http://localhost:8080
          provenance: true
          sbom: true

  # OCR images are large; rebuild them only when their inputs changed in this
  # push, or when a :main image is missing (first deploy, new model).
  ocr-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    env:
      GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.OCR_GCLOUD_OIDC_POOL }}
          service_account: ${{ vars.OCR_GSA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: 576.0.0
      - id: detect
        run: |
          changed=true
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            mapfile -t paths < <(./ci/ocr-source-paths.sh)
            if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "${paths[@]}"; then
              changed=false
            fi
          fi
          if [ "$changed" = false ]; then
            for image in $(go run ./cmd/ocr-matrix | jq -r '.include[].image'); do
              if ! gcloud artifacts docker images describe "$image" >/dev/null 2>&1; then
                echo "$image is missing"
                changed=true
              fi
            done
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build-ocr:
    needs: [ocr-changes]
    if: needs.ocr-changes.outputs.changed == 'true'
    uses: ./.github/workflows/build-ocr.yaml
    permissions:
      contents: read
      id-token: write

  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      ACTION: ${{ github.event_name == 'push' && 'apply' || inputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCLOUD_PROJECT }}
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: 576.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.4
      - name: Terraform ${{ env.ACTION }} foundation
        run: |
          # Terraform cannot manage project services until Service Usage is on.
          gcloud services enable serviceusage.googleapis.com --project="$GCLOUD_PROJECT"
          terraform -chdir=terraform/foundation init -input=false -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=scribe-foundation"
          if [ "$ACTION" = apply ]; then
            terraform -chdir=terraform/foundation apply -input=false -auto-approve -var="project_id=${GCLOUD_PROJECT}"
          else
            terraform -chdir=terraform/foundation plan -input=false -var="project_id=${GCLOUD_PROJECT}"
          fi

  deploy:
    needs: [images, ocr-changes, build-ocr, foundation]
    # build-ocr is skipped when OCR inputs are unchanged; manual runs skip the builds.
    if: >-
      always() &&
      needs.foundation.result == 'success' &&
      (github.event_name != 'push' || (needs.images.result == 'success' && needs.ocr-changes.result == 'success')) &&
      contains(fromJSON('["success", "skipped"]'), needs.build-ocr.result)
    uses: ./.github/workflows/terraform-deploy.yaml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      environment: production
      action: ${{ github.event_name == 'push' && 'apply' || inputs.action }}
