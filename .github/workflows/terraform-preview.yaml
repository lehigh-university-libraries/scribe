name: Terraform Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: terraform-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare-image-tag:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.image-tag.outputs.tag }}
      image_tag: ${{ steps.image-tag.outputs.image_tag }}
      frontend_image_tag: ${{ steps.image-tag.outputs.frontend_image_tag }}
      frontend_gar_image: ${{ steps.image-tag.outputs.frontend_gar_image }}
      frontend_gar_image_tag: ${{ steps.image-tag.outputs.frontend_gar_image_tag }}
      backend_origin: ${{ steps.image-tag.outputs.backend_origin }}
    env:
      GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
      SCRIBE_ZONE: ${{ vars.SCRIBE_ZONE != '' && vars.SCRIBE_ZONE || 'us-east5-b' }}
    steps:
      - name: Validate workflow variables
        shell: bash
        run: |
          if [ -z "$GCLOUD_PROJECT" ]; then
            echo "GitHub Actions variable GCLOUD_PROJECT must be set." >&2
            exit 1
          fi
      - name: Sanitize PR image tag
        id: image-tag
        env:
          RAW_TAG: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          TAG=$(echo "$RAW_TAG" | sed 's/[^a-zA-Z0-9._-]//g' | awk '{print substr($0, length($0)-120)}')
          GAR_REPO="us-docker.pkg.dev/${GCLOUD_PROJECT}/internal"
          {
            echo "tag=$TAG"
            echo "image_tag=ghcr.io/lehigh-university-libraries/scribe:$TAG"
            echo "frontend_image_tag=ghcr.io/lehigh-university-libraries/scribe-frontend:$TAG"
            echo "frontend_gar_image=${GAR_REPO}/scribe-frontend"
            echo "frontend_gar_image_tag=${GAR_REPO}/scribe-frontend:$TAG"
            echo "backend_origin=http://scribe-pr-${PR_NUMBER}.${SCRIBE_ZONE}.c.${GCLOUD_PROJECT}.internal"
          } >> "$GITHUB_OUTPUT"

  build-push:
    if: github.event.action != 'closed'
    uses: lehigh-university-libraries/gha/.github/workflows/build-push-ghcr.yaml@0ad0a7d96a7b3a5c05ad811832108d67e3dea92c # main
    permissions:
      contents: read
      packages: write
    secrets: inherit

  build-frontend:
    if: github.event.action != 'closed'
    needs: [prepare-image-tag]
    uses: lehigh-university-libraries/gha/.github/workflows/build-push-ghcr.yaml@0ad0a7d96a7b3a5c05ad811832108d67e3dea92c # main
    permissions:
      id-token: write
      contents: read
      packages: write
    secrets: inherit
    with:
      image: scribe-frontend
      file: Dockerfile.frontend
      gar_image: ${{ needs.prepare-image-tag.outputs.frontend_gar_image }}
      build_args: |
        SCRIBE_FRONTEND_BACKEND_ORIGIN=${{ needs.prepare-image-tag.outputs.backend_origin }}
        SCRIBE_FRONTEND_IIIF_ORIGIN=${{ needs.prepare-image-tag.outputs.backend_origin }}:8081

  build-ocr:
    if: github.event.action != 'closed'
    needs: [prepare-image-tag]
    uses: ./.github/workflows/build-ocr.yaml
    permissions:
      id-token: write
      contents: read
      packages: write
    secrets: inherit
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      workspace_slug: pr-${{ github.event.pull_request.number }}
      image_tag: ${{ needs.prepare-image-tag.outputs.tag }}

  sync-dev-shared:
    if: github.event.action != 'closed'
    needs: [prepare-image-tag, build-ocr]
    runs-on: ubuntu-24.04
    concurrency:
      group: terraform-preview-dev-shared
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      packages: write
    env:
      GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      ALLOWED_IPS: ${{ vars.ALLOWED_IPS }}
      ALLOWED_SSH_IPV4: ${{ vars.ALLOWED_SSH_IPV4 }}
      SCRIBE_API_IMAGE: ${{ needs.prepare-image-tag.outputs.image_tag }}
      SCRIBE_FRONTEND_IMAGE: ${{ needs.prepare-image-tag.outputs.frontend_image_tag }}
      SCRIBE_FRONTEND_GAR_IMAGE: ${{ needs.prepare-image-tag.outputs.frontend_gar_image_tag }}
      SCRIBE_OCR_IMAGES_JSON: ${{ needs.build-ocr.outputs.images_json }}
    steps:
      - name: Validate workflow variables
        shell: bash
        run: |
          if [ -z "$GCLOUD_PROJECT" ]; then
            echo "GitHub Actions variable GCLOUD_PROJECT must be set." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4
        with:
          terraform_version: 1.5.7

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: latest

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}
          token_format: access_token
          access_token_scopes: |-
            https://www.googleapis.com/auth/cloud-platform
            https://www.googleapis.com/auth/userinfo.email

      - name: Configure gcloud
        run: |
          gcloud config set project "${GCLOUD_PROJECT}"
          gcloud config set disable_prompts true

      - name: "GAR login"
        uses: "docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121" # v4
        with:
          registry: "us-docker.pkg.dev"
          username: "oauth2accesstoken"
          password: "${{ steps.auth.outputs.access_token }}"

      - name: Authenticate Vault admin header token
        id: auth_vault_access
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/userinfo.email
          create_credentials_file: false

      - name: Resolve shared dev Vault address
        id: vault_addr
        shell: bash
        run: |
          vault_addr="$(gcloud run services describe vault-server-dev --region us-east5 --format='value(status.url)')"
          vault_audience="$(gcloud run services describe vault-server-dev --region us-east5 --format='value(uri)')"
          if [ -z "$vault_addr" ]; then
            echo "Failed to resolve Vault address for vault-server-dev" >&2
            exit 1
          fi
          if [ -z "$vault_audience" ]; then
            vault_audience="$vault_addr"
          fi
          echo "vault_addr=$vault_addr" >> "$GITHUB_OUTPUT"
          echo "vault_audience=$vault_audience" >> "$GITHUB_OUTPUT"

      - name: Compute Vault CI role name
        id: vault_role
        shell: bash
        env:
          VAULT_GSA: ${{ secrets.GSA }}
        run: |
          sanitized="$(printf '%s' "$VAULT_GSA" | sed 's/@/-at-/g; s/\./-/g')"
          echo "role_name=ci-${sanitized}" >> "$GITHUB_OUTPUT"

      - name: Authenticate Google ID token for Vault
        id: auth_vault_id
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}
          token_format: id_token
          id_token_audience: ${{ steps.vault_addr.outputs.vault_audience }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Login to shared dev Vault
        shell: bash
        env:
          VAULT_ADDR: ${{ steps.vault_addr.outputs.vault_addr }}
          VAULT_ADMIN_TOKEN: ${{ steps.auth_vault_access.outputs.access_token }}
          VAULT_ID_TOKEN: ${{ steps.auth_vault_id.outputs.id_token }}
          VAULT_ROLE: ${{ steps.vault_role.outputs.role_name }}
        run: bash ./ci/vault-login.sh

      - name: Sync shared dev owner resources
        shell: bash
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -o pipefail
          make tf-dev-vault BRANCH="$PR_BRANCH" ACTION=apply
          make tf-dev-ocr BRANCH="$PR_BRANCH" ACTION=apply

  lint-test:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/lint-test.yaml
    permissions:
      contents: read
    secrets: inherit
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}

  preview:
    if: github.event.action != 'closed'
    needs: [prepare-image-tag, sync-dev-shared, build-push, build-frontend, build-ocr, lint-test]
    uses: ./.github/workflows/terraform-deploy.yaml
    permissions:
      id-token: write
      contents: read
      packages: write
    secrets: inherit
    with:
      mode: apply
      environment_name: preview
      tf_workspace: pr-${{ github.event.pull_request.number }}
      site_name: scribe-pr-${{ github.event.pull_request.number }}
      docker_compose_branch: ${{ github.event.pull_request.head.ref }}
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      pr_number: "${{ github.event.pull_request.number }}"
      run_snapshots: "false"
      push_image: false
      image_tag: ${{ needs.prepare-image-tag.outputs.image_tag }}
      frontend_image_tag: ${{ needs.prepare-image-tag.outputs.frontend_image_tag }}
      frontend_gar_image_tag: ${{ needs.prepare-image-tag.outputs.frontend_gar_image_tag }}
      ocr_images_json: ${{ needs.build-ocr.outputs.images_json }}

  preview-comment:
    if: always() && github.event.action != 'closed'
    needs: [preview, lint-test]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Post preview status comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commentIdentifier = '<!-- terraform-preview-comment -->';
            const previewUrl = `${{ needs.preview.outputs.preview_url }}`;
            const status = `${{ needs.preview.outputs.status || needs.preview.result }}`;
            const newCommentBody = `#### Terraform Preview
            ${commentIdentifier}
            Environment: \`scribe-pr-${{ github.event.pull_request.number }}\`
            Workspace: \`pr-${{ github.event.pull_request.number }}\`
            Action: \`apply\`
            Status: \`${status}\`
            ${previewUrl ? `URL: ${previewUrl}` : '' }

            Full Terraform output is intentionally not posted here.
            Review the workflow run logs for details.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });

            const existingComment = comments.find(comment => comment.body.includes(commentIdentifier));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: newCommentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: newCommentBody
              });
            }

  destroy-preview:
    if: github.event.action == 'closed'
    uses: ./.github/workflows/terraform-deploy.yaml
    permissions:
      id-token: write
      contents: read
      packages: write
    secrets: inherit
    with:
      mode: destroy
      environment_name: preview
      tf_workspace: pr-${{ github.event.pull_request.number }}
      site_name: scribe-pr-${{ github.event.pull_request.number }}
      docker_compose_branch: ${{ github.event.pull_request.head.ref }}
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      pr_number: "${{ github.event.pull_request.number }}"
      run_snapshots: "false"
      push_image: false
