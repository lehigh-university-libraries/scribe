name: Terraform Preview

# Preview deployment runs automatically for same-repository pull requests. The
# workflow definition and every cloud-credentialed executable helper come from
# the trusted base commit. The credentialed browser build may copy one bounded,
# blob-verified PR-head readiness script, but only its isolated no-IAM preview
# job executes that script. Forks are skipped, and closing a PR destroys its
# preview automatically.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to preview or destroy.
        required: true
        type: number
      action:
        description: Preview lifecycle action.
        required: true
        type: choice
        default: deploy
        options: [deploy, destroy, recover-destroy]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]

permissions:
  contents: read

concurrency:
  group: terraform-preview-pr-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend_origin: ${{ steps.resolve.outputs.backend_origin }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      frontend_gar_image_tag: ${{ steps.resolve.outputs.frontend_gar_image_tag }}
      frontend_image_tag: ${{ steps.resolve.outputs.frontend_image_tag }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      mode: ${{ steps.resolve.outputs.mode }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      preview_machine_type: ${{ steps.resolve.outputs.preview_machine_type }}
      recover_destroy_inputs: ${{ steps.resolve.outputs.recover_destroy_inputs }}
      region: ${{ steps.resolve.outputs.region }}
      tag: ${{ steps.resolve.outputs.tag }}
      zone: ${{ steps.resolve.outputs.zone }}
    env:
      GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
      SCRIBE_PREVIEW_MACHINE_TYPE: ${{ vars.SCRIBE_PREVIEW_MACHINE_TYPE != '' && vars.SCRIBE_PREVIEW_MACHINE_TYPE || 'n2d-standard-2' }}
      SCRIBE_REGION: ${{ vars.SCRIBE_REGION != '' && vars.SCRIBE_REGION || 'us-east5' }}
      SCRIBE_ZONE: ${{ vars.SCRIBE_PREVIEW_ZONE != '' && vars.SCRIBE_PREVIEW_ZONE || 'us-east5-c' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout protected preview orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Set up Go for typed preview input resolution
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: false
      - id: resolve
        name: Resolve immutable preview inputs
        env:
          DISPATCH_ACTION: ${{ inputs.action }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PREVIOUS_BASE_REF: ${{ github.event.changes.base.ref.from }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          WORKFLOW_REF: ${{ github.ref }}
        run: ./ci/resolve-preview-inputs.sh

  lint-test:
    if: needs.prepare.outputs.mode == 'apply'
    needs: [prepare]
    uses: ./.github/workflows/lint-test.yaml
    permissions:
      contents: read
    with:
      checkout_ref: ${{ needs.prepare.outputs.head_sha }}

  build-backend:
    if: needs.prepare.outputs.mode == 'apply'
    needs: [prepare, lint-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build credential-free backend OCI archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/scribe-backend.oci.tar
          tags: ${{ needs.prepare.outputs.image_tag }}
          provenance: true
          sbom: true
      - name: Upload backend OCI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-backend-${{ needs.prepare.outputs.head_sha }}
          path: ${{ runner.temp }}/scribe-backend.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-frontend:
    if: needs.prepare.outputs.mode == 'apply'
    needs: [prepare, lint-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build local frontend smoke image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64
          load: true
          tags: scribe-frontend:${{ needs.prepare.outputs.head_sha }}
          build-args: |
            SCRIBE_FRONTEND_BACKEND_ORIGIN=${{ needs.prepare.outputs.backend_origin }}
      - name: Smoke-test the packaged frontend runtime
        env:
          FRONTEND_IMAGE: scribe-frontend:${{ needs.prepare.outputs.head_sha }}
        run: ./ci/frontend-image-smoke.sh "$FRONTEND_IMAGE"
      - name: Build credential-free frontend OCI archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/scribe-frontend.oci.tar
          tags: ${{ needs.prepare.outputs.frontend_image_tag }}
          provenance: true
          sbom: true
          build-args: |
            SCRIBE_FRONTEND_BACKEND_ORIGIN=${{ needs.prepare.outputs.backend_origin }}
      - name: Upload frontend OCI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-frontend-${{ needs.prepare.outputs.head_sha }}
          path: ${{ runner.temp }}/scribe-frontend.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-images:
    if: needs.prepare.outputs.mode == 'apply'
    needs: [prepare, build-backend, build-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.publish.outputs.backend_image }}
      frontend_image: ${{ steps.publish.outputs.frontend_image }}
    steps:
      - name: Checkout protected scanner implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Download backend OCI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: preview-backend-${{ needs.prepare.outputs.head_sha }}
          path: ${{ runner.temp }}/preview-images
      - name: Download frontend OCI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: preview-frontend-${{ needs.prepare.outputs.head_sha }}
          path: ${{ runner.temp }}/preview-images
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: publish
        name: Publish reviewed OCI archives by digest
        env:
          BACKEND_TAG: ${{ needs.prepare.outputs.image_tag }}
          FRONTEND_TAG: ${{ needs.prepare.outputs.frontend_image_tag }}
          SKOPEO_IMAGE: quay.io/skopeo/stable:v1.22.2@sha256:9fb5c292a0a96ebf9c52076a64e33def0964258ba8e5903aea449e74a27f9914
        run: ./ci/publish-preview-images.sh
  resolve-production-ocr-images:
    if: needs.prepare.outputs.mode == 'apply'
    needs: [prepare, lint-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview
    concurrency:
      group: terraform-deploy-scribe
      queue: max
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    outputs:
      images_json: ${{ steps.resolve.outputs.images_json }}
    env:
      GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - name: Checkout protected OCR selection logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCLOUD_PROJECT }}
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: 576.0.0
      - name: Verify preview deploy WIF trust boundary
        env:
          WIF_EXPECTED_ENVIRONMENT: preview
          WIF_IDENTITY_CLASS: deploy
          WIF_PROVIDER: ${{ secrets.GCLOUD_OIDC_POOL }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GSA }}
        run: ./ci/verify-gcp-wif.sh
      - id: resolve
        name: Select the deployed production OCR digest map
        shell: bash
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: |
          set -euo pipefail
          test -n "$GCLOUD_PROJECT"
          test -n "$TF_STATE_BUCKET"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]

          terraform -chdir=terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=scribe" >/dev/null
          terraform -chdir=terraform workspace select prod >/dev/null
          deployment_inputs="$(terraform -chdir=terraform output -json deployment_inputs)"
          deployed="$(
            printf '%s\n' "$deployment_inputs" |
              ./ci/resolve-rollback-inputs.sh -
          )"
          unset deployment_inputs

          [ "$(jq -r '.configuration.project_id' <<<"$deployed")" = "$GCLOUD_PROJECT" ] || {
            echo "The production deployment record belongs to another project." >&2
            exit 1
          }
          [ "$(jq -r '.docker_compose_sha' <<<"$deployed")" = "$BASE_SHA" ] || {
            echo "Production has not deployed the current protected main commit; retry the preview after production finishes." >&2
            exit 1
          }

          recorded_ocr_images="$(jq -c '.ocr_service_images' <<<"$deployed")"
          images_json="$(
            GCLOUD_PROJECT="$GCLOUD_PROJECT" \
              WORKSPACE_SLUG="pr-${PR_NUMBER}" \
              INCLUDE_OLLAMA=false \
              ./ci/select-current-ocr-images.sh <<<"$recorded_ocr_images"
          )"
          echo "images_json=${images_json}" >> "$GITHUB_OUTPUT"

  deploy:
    if: needs.prepare.outputs.mode == 'apply'
    needs: [prepare, lint-test, build-backend, build-frontend, publish-images, resolve-production-ocr-images]
    uses: ./.github/workflows/terraform-deploy.yaml
    permissions:
      id-token: write
      contents: read
      packages: read
    secrets: inherit
    with:
      mode: apply
      environment_name: preview
      tf_workspace: pr-${{ needs.prepare.outputs.pr_number }}
      site_name: scribe-pr-${{ needs.prepare.outputs.pr_number }}
      docker_compose_branch: ${{ needs.prepare.outputs.base_sha }}
      checkout_ref: ${{ needs.prepare.outputs.base_sha }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      browser_readiness_source_sha: ${{ needs.prepare.outputs.head_sha }}
      image_tag: ${{ needs.publish-images.outputs.backend_image }}
      frontend_image_tag: ${{ needs.publish-images.outputs.frontend_image }}
      frontend_gar_image_tag: ${{ needs.prepare.outputs.frontend_gar_image_tag }}
      ocr_images_json: ${{ needs.resolve-production-ocr-images.outputs.images_json }}
      preview_machine_type: ${{ needs.prepare.outputs.preview_machine_type }}
      region: ${{ needs.prepare.outputs.region }}
      zone: ${{ needs.prepare.outputs.zone }}

  destroy:
    if: needs.prepare.outputs.mode == 'destroy'
    needs: [prepare]
    uses: ./.github/workflows/terraform-deploy.yaml
    permissions:
      id-token: write
      contents: read
      packages: read
    secrets: inherit
    with:
      mode: destroy
      environment_name: preview
      tf_workspace: pr-${{ needs.prepare.outputs.pr_number }}
      site_name: scribe-pr-${{ needs.prepare.outputs.pr_number }}
      docker_compose_branch: ${{ needs.prepare.outputs.base_sha }}
      checkout_ref: ${{ needs.prepare.outputs.base_sha }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      recover_preview_destroy_inputs: ${{ needs.prepare.outputs.recover_destroy_inputs == 'true' }}
      preview_machine_type: ${{ needs.prepare.outputs.preview_machine_type }}
      region: ${{ needs.prepare.outputs.region }}
      zone: ${{ needs.prepare.outputs.zone }}

  record-preview-deployment:
    if: always() && (needs.prepare.outputs.mode == 'apply' || needs.prepare.outputs.mode == 'destroy')
    needs: [prepare, deploy, destroy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      deployments: write
      pull-requests: read
    steps:
      - name: Record exact PR-head preview evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_STATUS: ${{ needs.deploy.outputs.status }}
          DESTROY_RESULT: ${{ needs.destroy.result }}
          DESTROY_STATUS: ${{ needs.destroy.outputs.status }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          PREVIEW_MODE: ${{ needs.prepare.outputs.mode }}
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const environment = 'preview';
            const headSha = process.env.HEAD_SHA || '';
            const mode = process.env.PREVIEW_MODE || '';
            const prNumber = Number(process.env.PR_NUMBER || '');
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${process.env.RUN_ID}`;

            if (!/^[0-9a-f]{40}$/.test(headSha)) throw new Error('validated preview head SHA is missing');
            if (!Number.isSafeInteger(prNumber) || prNumber < 1) throw new Error('validated preview PR number is missing');
            if (mode !== 'apply' && mode !== 'destroy') throw new Error('preview evidence mode must be apply or destroy');

            const deploymentPayload = (deployment) => {
              if (deployment.payload && typeof deployment.payload === 'object') return deployment.payload;
              if (typeof deployment.payload !== 'string' || deployment.payload === '') return {};
              try {
                return JSON.parse(deployment.payload);
              } catch {
                return {};
              }
            };
            const belongsToPR = (deployment) => Number(deploymentPayload(deployment).pr_number) === prNumber;
            const listPRDeployments = async () => {
              const deployments = await github.paginate(github.rest.repos.listDeployments, {
                owner,
                repo,
                environment,
                per_page: 100,
              });
              return deployments.filter(belongsToPR);
            };
            const latestState = async (deploymentId) => {
              const response = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deploymentId,
                per_page: 1,
              });
              return response.data[0]?.state || '';
            };
            const postStatus = async (deploymentId, state, description, environmentUrl = '') => {
              const request = {
                owner,
                repo,
                deployment_id: deploymentId,
                state,
                environment,
                auto_inactive: false,
                description: description.slice(0, 140),
                log_url: runUrl,
              };
              if (environmentUrl !== '') request.environment_url = environmentUrl;
              await github.rest.repos.createDeploymentStatus(request);
            };
            const inactivate = async (deployments, description) => {
              for (const deployment of deployments) {
                if (await latestState(deployment.id) === 'inactive') continue;
                await postStatus(deployment.id, 'inactive', description);
              }
            };
            const createDeployment = async (phase) => {
              const response = await github.rest.repos.createDeployment({
                owner,
                repo,
                ref: headSha,
                task: 'deploy',
                auto_merge: false,
                required_contexts: [],
                environment,
                description: `Scribe PR #${prNumber} preview ${phase}`,
                transient_environment: true,
                production_environment: false,
                payload: {
                  pr_number: prNumber,
                  head_sha: headSha,
                  phase,
                  run_id: Number(process.env.RUN_ID),
                  run_attempt: Number(process.env.RUN_ATTEMPT),
                },
              });
              if (
                !response.data
                || !Number.isSafeInteger(response.data.id)
                || response.data.sha !== headSha
              ) {
                throw new Error('GitHub did not create exact-head preview deployment evidence');
              }
              return response.data.id;
            };
            const validPreviewURL = () => {
              const raw = process.env.PREVIEW_URL || '';
              try {
                const parsed = new URL(raw);
                const expectedPrefix = `scribe-pr-${prNumber}-`;
                if (
                  parsed.protocol !== 'https:'
                  || parsed.username !== ''
                  || parsed.password !== ''
                  || parsed.pathname !== '/'
                  || parsed.search !== ''
                  || parsed.hash !== ''
                  || !parsed.hostname.startsWith(expectedPrefix)
                  || !parsed.hostname.endsWith('.run.app')
                ) return '';
                return parsed.toString();
              } catch {
                return '';
              }
            };

            if (mode === 'destroy') {
              const prior = await listPRDeployments();
              const destroySucceeded = process.env.DESTROY_RESULT === 'success'
                && process.env.DESTROY_STATUS === 'success';
              if (destroySucceeded) {
                await inactivate(prior, `Preview PR #${prNumber} was destroyed`);
                core.notice(`Marked ${prior.length} preview deployment(s) inactive for PR #${prNumber}.`);
                return;
              }

              await inactivate(prior, `Preview PR #${prNumber} teardown failed`);
              const deploymentId = await createDeployment('destroy-failed');
              try {
                await postStatus(deploymentId, 'in_progress', `Preview PR #${prNumber} teardown evidence pending`);
                await postStatus(deploymentId, 'error', `Preview PR #${prNumber} teardown failed`);
              } catch (error) {
                try {
                  await postStatus(deploymentId, 'error', `Preview PR #${prNumber} teardown evidence failed`);
                } catch (statusError) {
                  core.error(`Could not record terminal teardown error: ${statusError.name}`);
                }
                throw error;
              }
              core.setFailed(`Preview teardown failed for PR #${prNumber}.`);
              return;
            }

            const live = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            const isCurrentHead = live.state === 'open'
              && live.base.ref === 'main'
              && live.head.repo?.full_name === `${owner}/${repo}`
              && live.head.sha === headSha;
            if (!isCurrentHead) {
              const stale = (await listPRDeployments()).filter((deployment) => deployment.sha === headSha);
              await inactivate(stale, `Stale preview run for PR #${prNumber}`);
              core.notice(`Skipped stale preview evidence for PR #${prNumber} at ${headSha}.`);
              return;
            }

            const prior = await listPRDeployments();
            await inactivate(prior, `Superseded preview for PR #${prNumber}`);
            const deploymentId = await createDeployment('apply');
            let terminalState = 'failure';
            let terminalDescription = `Preview deployment failed for PR #${prNumber}`;
            let environmentUrl = '';
            if (process.env.DEPLOY_RESULT === 'success' && process.env.DEPLOY_STATUS === 'success') {
              environmentUrl = validPreviewURL();
              if (environmentUrl !== '') {
                terminalState = 'success';
                terminalDescription = `Preview readiness passed for PR #${prNumber}`;
              } else {
                terminalState = 'error';
                terminalDescription = `Preview URL attestation failed for PR #${prNumber}`;
              }
            } else if (process.env.DEPLOY_RESULT === 'cancelled' || process.env.DEPLOY_RESULT === 'skipped') {
              terminalState = 'error';
              terminalDescription = `Preview deployment did not run for PR #${prNumber}`;
            }

            try {
              await postStatus(deploymentId, 'in_progress', `Preview evidence pending for PR #${prNumber}`);
              await postStatus(deploymentId, terminalState, terminalDescription, environmentUrl);
            } catch (error) {
              try {
                await postStatus(deploymentId, 'error', `Preview evidence recording failed for PR #${prNumber}`);
              } catch (statusError) {
                core.error(`Could not record terminal deployment error: ${statusError.name}`);
              }
              throw error;
            }
            if (terminalState !== 'success') core.setFailed(terminalDescription);

  preview-comment:
    if: always() && needs.prepare.outputs.mode == 'apply'
    needs: [prepare, deploy]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_STATUS: ${{ needs.deploy.outputs.status || needs.deploy.result }}
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- terraform-preview-comment -->';
            const body = `#### Terraform Preview\n${marker}\nStatus: \`${process.env.PREVIEW_STATUS}\`\n${process.env.PREVIEW_URL ? `URL: ${process.env.PREVIEW_URL}` : ''}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER)
            });
            const existing = comments.find(comment => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: Number(process.env.PR_NUMBER), body });
            }
