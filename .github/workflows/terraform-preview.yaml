name: Terraform Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: terraform-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare-image-tag:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.image-tag.outputs.image_tag }}
      frontend_image_tag: ${{ steps.image-tag.outputs.frontend_image_tag }}
      frontend_gar_image_tag: ${{ steps.image-tag.outputs.frontend_gar_image_tag }}
      backend_origin: ${{ steps.image-tag.outputs.backend_origin }}
    env:
      GCLOUD_PROJECT: ${{ secrets.GCLOUD_PROJECT }}
      SCRIBE_ZONE: ${{ vars.SCRIBE_ZONE != '' && vars.SCRIBE_ZONE || 'us-east5-b' }}
    steps:
      - name: Sanitize PR image tag
        id: image-tag
        env:
          RAW_TAG: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          TAG=$(echo "$RAW_TAG" | sed 's/[^a-zA-Z0-9._-]//g' | awk '{print substr($0, length($0)-120)}')
          GAR_REPO="us-docker.pkg.dev/${GCLOUD_PROJECT}/internal"
          {
            echo "image_tag=ghcr.io/lehigh-university-libraries/scribe:$TAG"
            echo "frontend_image_tag=ghcr.io/lehigh-university-libraries/scribe-frontend:$TAG"
            echo "frontend_gar_image_tag=${GAR_REPO}/scribe-frontend:$TAG"
            echo "backend_origin=http://scribe-pr-${PR_NUMBER}.${SCRIBE_ZONE}.c.${GCLOUD_PROJECT}.internal"
          } >> "$GITHUB_OUTPUT"

  build-push:
    if: github.event.action != 'closed'
    uses: lehigh-university-libraries/gha/.github/workflows/build-push-ghcr.yaml@0ad0a7d96a7b3a5c05ad811832108d67e3dea92c # main
    permissions:
      contents: read
      packages: write
    secrets: inherit

  build-frontend:
    if: github.event.action != 'closed'
    needs: [prepare-image-tag]
    uses: lehigh-university-libraries/gha/.github/workflows/build-push-ghcr.yaml@0ad0a7d96a7b3a5c05ad811832108d67e3dea92c # main
    permissions:
      id-token: write
      contents: read
      packages: write
    secrets: inherit
    with:
      image: scribe-frontend
      file: Dockerfile.frontend
      gar_image: ${{ needs.prepare-image-tag.outputs.frontend_gar_image_tag }}
      build_args: |
        SCRIBE_FRONTEND_BACKEND_ORIGIN=${{ needs.prepare-image-tag.outputs.backend_origin }}

  lint-test:
    if: github.event.action != 'closed'
    needs: [prepare-image-tag, build-push]
    uses: ./.github/workflows/lint-test.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      image_tag: ${{ needs.prepare-image-tag.outputs.image_tag }}

  preview:
    if: github.event.action != 'closed'
    needs: [prepare-image-tag, build-push, build-frontend]
    uses: ./.github/workflows/terraform-deploy.yaml
    permissions:
      id-token: write
      contents: read
      packages: write
    secrets: inherit
    with:
      mode: apply
      environment_name: preview
      tf_workspace: pr-${{ github.event.pull_request.number }}
      site_name: scribe-pr-${{ github.event.pull_request.number }}
      docker_compose_branch: ${{ github.event.pull_request.head.ref }}
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      pr_number: "${{ github.event.pull_request.number }}"
      run_snapshots: "false"
      push_image: false
      image_tag: ${{ needs.prepare-image-tag.outputs.image_tag }}
      frontend_image_tag: ${{ needs.prepare-image-tag.outputs.frontend_image_tag }}
      frontend_gar_image_tag: ${{ needs.prepare-image-tag.outputs.frontend_gar_image_tag }}

  preview-comment:
    if: github.event.action != 'closed'
    needs: [preview, lint-test]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Post preview status comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commentIdentifier = '<!-- terraform-preview-comment -->';
            const previewUrl = `${{ needs.preview.outputs.preview_url }}`;
            const newCommentBody = `#### Terraform Preview
            ${commentIdentifier}
            Environment: \`scribe-pr-${{ github.event.pull_request.number }}\`
            Workspace: \`pr-${{ github.event.pull_request.number }}\`
            Action: \`apply\`
            Status: \`${{ needs.preview.outputs.status }}\`
            ${previewUrl ? `URL: ${previewUrl}` : '' }

            Full Terraform output is intentionally not posted here.
            Review the workflow run logs for details.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });

            const existingComment = comments.find(comment => comment.body.includes(commentIdentifier));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: newCommentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: newCommentBody
              });
            }

  destroy-preview:
    if: github.event.action == 'closed'
    uses: ./.github/workflows/terraform-deploy.yaml
    permissions:
      id-token: write
      contents: read
      packages: write
    secrets: inherit
    with:
      mode: destroy
      environment_name: preview
      tf_workspace: pr-${{ github.event.pull_request.number }}
      site_name: scribe-pr-${{ github.event.pull_request.number }}
      docker_compose_branch: ${{ github.event.pull_request.head.ref }}
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      pr_number: "${{ github.event.pull_request.number }}"
      run_snapshots: "false"
      push_image: false
