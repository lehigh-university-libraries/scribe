name: Terraform Preview

# Same-repository pull requests get a preview environment; closing the PR
# destroys it. Pull-request code is built without credentials. The credentialed
# jobs only push the built archives and run Terraform from main.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request whose preview to destroy.
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: terraform-preview-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}

jobs:
  lint-test:
    if: >-
      github.event_name == 'pull_request_target' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/lint-test.yaml
    permissions:
      contents: read
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}

  build:
    needs: [lint-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: backend
            file: Dockerfile
          - name: frontend
            file: Dockerfile.frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.name }}.oci.tar
          build-args: |
            SCRIBE_FRONTEND_BACKEND_ORIGIN=http://localhost:8080
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.oci.tar
          compression-level: 0
          retention-days: 1

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
      id-token: write
    env:
      SKOPEO_IMAGE: quay.io/skopeo/stable:v1.22.2@sha256:db4108427c05acbadd1447316caa9b5f097a9a737d897d2297443baedff37ded
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: preview-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}
          token_format: access_token
      - name: Push images
        env:
          GAR_TOKEN: ${{ steps.auth.outputs.access_token }}
          IMAGES: ${{ runner.temp }}/images
          BACKEND: us-docker.pkg.dev/${{ vars.GCLOUD_PROJECT }}/internal/scribe:pr-${{ env.PR_NUMBER }}
          FRONTEND: us-docker.pkg.dev/${{ vars.GCLOUD_PROJECT }}/internal/scribe-frontend:pr-${{ env.PR_NUMBER }}
        run: |
          skopeo() { docker run --rm -v "$IMAGES:/images:ro" "$SKOPEO_IMAGE" "$@"; }
          skopeo copy --all --dest-creds "oauth2accesstoken:${GAR_TOKEN}" \
            oci-archive:/images/backend.oci.tar "docker://${BACKEND}"
          skopeo copy --all --dest-creds "oauth2accesstoken:${GAR_TOKEN}" \
            oci-archive:/images/frontend.oci.tar "docker://${FRONTEND}"

  deploy:
    needs: [publish]
    uses: ./.github/workflows/terraform-deploy.yaml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      environment: preview
      action: apply
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      image_tag: pr-${{ github.event.pull_request.number }}

  comment:
    needs: [deploy]
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RESULT: ${{ needs.deploy.result }}
          URL: ${{ needs.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- terraform-preview-comment -->';
            const body = `#### Preview\n${marker}\nStatus: \`${process.env.RESULT}\`\n${process.env.URL ? `URL: ${process.env.URL}` : ''}`;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

  destroy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/terraform-deploy.yaml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      environment: preview
      action: destroy
      pr_number: ${{ format('{0}', inputs.pr_number || github.event.pull_request.number) }}
