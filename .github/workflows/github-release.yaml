name: Create release
on:
  pull_request_target:
    branches:
      - main
    types:
      - closed
jobs:
  release:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.title, 'skip-release')
    uses: lehigh-university-libraries/gha/.github/workflows/bump-release.yaml@60c5d3a7a8f89290bbe0db056a0116855f59bb6c # main
    with:
      workflow_file: goreleaser.yaml
    permissions:
      contents: write
      actions: write
    secrets: inherit
