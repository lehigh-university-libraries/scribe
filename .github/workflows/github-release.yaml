name: Create release

# Each merged pull request to main is tagged by AutoTag (unless its title says
# skip-release) and released by GoReleaser.
on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.title, 'skip-release')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install hash-pinned AutoTag
        env:
          AUTOTAG_SHA256: 7b34c34316b8dd57b43ca0b08454ba57baf6472bef4e5ea46215b6ef5cd96146
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.4.1 --repo autotag-dev/autotag --pattern autotag_linux_amd64 --dir "$RUNNER_TEMP"
          echo "$AUTOTAG_SHA256  $RUNNER_TEMP/autotag_linux_amd64" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/autotag_linux_amd64"

      - name: Tag the merge commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git branch --force release "$SHA"
          tag="$("$RUNNER_TEMP/autotag_linux_amd64" --empty-version-prefix --branch release)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_REPO_TOKEN: ${{ secrets.HOMEBREW_REPO_GHAT }}
