name: Production Debug

on:
  workflow_dispatch:

jobs:
  vm:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
      SCRIBE_ZONE: ${{ vars.SCRIBE_ZONE != '' && vars.SCRIBE_ZONE || 'us-east5-b' }}
    steps:
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}

      - name: Inspect production VM
        shell: bash
        run: |
          set -x
          gcloud config set project "${GCLOUD_PROJECT}"
          gcloud compute instances describe scribe \
            --zone "${SCRIBE_ZONE}" \
            --format='yaml(id,status,networkInterfaces[0].networkIP,tags.items)'
          gcloud compute ssh scribe \
            --zone "${SCRIBE_ZONE}" \
            --tunnel-through-iap \
            --command 'sudo bash -lc "
              set +e
              date -u
              systemctl status cloud-compose --no-pager -l
              echo ==== run.log ====
              tail -200 /home/cloud-compose/run.log
              echo ==== repo ====
              cd /mnt/disks/data/lehigh-university-libraries/scribe.git/main
              git rev-parse HEAD
              git status --short
              echo ==== compose ps ====
              docker compose ps
              echo ==== compose logs ====
              docker compose logs --tail=160 mariadb api worker traefik triplet
            "'
