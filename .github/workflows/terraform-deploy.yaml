name: Terraform Deploy

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      tf_workspace:
        required: true
        type: string
      site_name:
        required: true
        type: string
      docker_compose_branch:
        required: true
        type: string
      checkout_ref:
        required: true
        type: string
      pr_number:
        required: false
        type: string
        default: ""
      run_snapshots:
        required: true
        type: string
      push_image:
        required: true
        type: boolean
      image_tag:
        required: false
        type: string
        default: ""
      frontend_image_tag:
        required: false
        type: string
        default: ""
      frontend_gar_image_tag:
        required: false
        type: string
        default: ""
      ocr_images_json:
        description: JSON map of OCR service_key -> digest-pinned GAR image reference.
        required: false
        type: string
        default: "{}"
    outputs:
      status:
        description: Workflow status for the terraform action.
        value: ${{ jobs.deploy.outputs.status }}
      preview_url:
        description: Cloud Run ingress URL for preview environments.
        value: ${{ jobs.deploy.outputs.preview_url }}
      image:
        description: Deployed GHCR image reference.
        value: ${{ jobs.deploy.outputs.image }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment_name }}
    permissions:
      id-token: write
      contents: read
      packages: write
    env:
      GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      ALLOWED_IPS: ${{ vars.ALLOWED_IPS }}
      ALLOWED_SSH_IPV4: ${{ vars.ALLOWED_SSH_IPV4 }}
      SCRIBE_ZONE: ${{ vars.SCRIBE_ZONE != '' && vars.SCRIBE_ZONE || 'us-east5-b' }}
      SCRIBE_API_IMAGE: ${{ inputs.image_tag }}
      SCRIBE_FRONTEND_IMAGE: ${{ inputs.frontend_image_tag }}
      SCRIBE_FRONTEND_GAR_IMAGE: ${{ inputs.frontend_gar_image_tag }}
      SCRIBE_OCR_IMAGES_JSON: ${{ inputs.ocr_images_json }}

    outputs:
      status: ${{ steps.capture.outputs.status }}
      preview_url: ${{ steps.preview_url.outputs.url }}
      image: ${{ steps.capture.outputs.image }}

    steps:
      - name: Validate workflow variables
        shell: bash
        run: |
          if [ -z "$GCLOUD_PROJECT" ]; then
            echo "GitHub Actions variable GCLOUD_PROJECT must be set." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Prepare Terraform artifact directory
        run: mkdir -p .github-artifacts/terraform

      - name: Install Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4
        with:
          terraform_version: 1.5.7

      - name: Check Terraform formatting
        if: inputs.mode == 'apply'
        run: terraform fmt -check -recursive

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: latest

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}
          token_format: access_token
          access_token_scopes: |-
            https://www.googleapis.com/auth/cloud-platform
            https://www.googleapis.com/auth/userinfo.email

      - name: Configure gcloud
        run: |
          gcloud config set project "${GCLOUD_PROJECT}"
          gcloud config set disable_prompts true

      - name: "GAR login"
        uses: "docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9" # v3
        with:
          registry: "us-docker.pkg.dev"
          username: "oauth2accesstoken"
          password: "${{ steps.auth.outputs.access_token }}"

      - name: Resolve pinned frontend GAR image
        id: frontend_gar_image
        if: inputs.mode == 'apply' && inputs.frontend_gar_image_tag != ''
        shell: bash
        run: |
          resolved_image="$(./ci/resolve-gar-image.sh '${{ inputs.frontend_gar_image_tag }}')"
          echo "resolved_image=$resolved_image" >> "$GITHUB_OUTPUT"
          echo "SCRIBE_FRONTEND_GAR_IMAGE=$resolved_image" >> "$GITHUB_ENV"

      - name: Authenticate Vault admin header token
        id: auth_vault_access
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/userinfo.email
          create_credentials_file: false

      - name: Resolve shared Vault address
        id: vault_addr
        shell: bash
        run: |
          if [ "${{ inputs.tf_workspace }}" = "prod" ]; then
            vault_service="vault-server-prod"
          else
            vault_service="vault-server-dev"
          fi
          vault_addr="$(gcloud run services describe "$vault_service" --region us-east5 --format='value(status.url)')"
          vault_audience="$(gcloud run services describe "$vault_service" --region us-east5 --format='value(uri)')"
          if [ -z "$vault_addr" ]; then
            echo "Failed to resolve Vault address for $vault_service" >&2
            exit 1
          fi
          if [ -z "$vault_audience" ]; then
            vault_audience="$vault_addr"
          fi
          echo "vault_addr=$vault_addr" >> "$GITHUB_OUTPUT"
          echo "vault_audience=$vault_audience" >> "$GITHUB_OUTPUT"

      - name: Compute Vault CI role name
        id: vault_role
        shell: bash
        env:
          VAULT_GSA: ${{ secrets.GSA }}
        run: |
          sanitized="$(printf '%s' "$VAULT_GSA" | sed 's/@/-at-/g; s/\./-/g')"
          echo "role_name=ci-${sanitized}" >> "$GITHUB_OUTPUT"

      - name: Authenticate Google ID token for Vault
        id: auth_vault_id
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}
          token_format: id_token
          id_token_audience: ${{ steps.vault_addr.outputs.vault_audience }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Login to Vault
        shell: bash
        env:
          VAULT_ADDR: ${{ steps.vault_addr.outputs.vault_addr }}
          VAULT_ADMIN_TOKEN: ${{ steps.auth_vault_access.outputs.access_token }}
          VAULT_ID_TOKEN: ${{ steps.auth_vault_id.outputs.id_token }}
          VAULT_ROLE: ${{ steps.vault_role.outputs.role_name }}
        run: |
          bash ./ci/vault-login.sh

      - name: Run production Terraform
        id: apply
        if: inputs.mode == 'apply' && inputs.pr_number == ''
        shell: bash
        run: |
          set -o pipefail
          make tf-prod ACTION=apply 2>&1 | tee ".github-artifacts/terraform/${{ inputs.tf_workspace }}-apply.log"

      - name: Run preview Terraform
        id: apply_preview
        if: inputs.mode == 'apply' && inputs.pr_number != ''
        shell: bash
        run: |
          set -o pipefail
          make tf-preview PR=${{ inputs.pr_number }} BRANCH=${{ inputs.docker_compose_branch }} ACTION=apply 2>&1 | tee ".github-artifacts/terraform/${{ inputs.tf_workspace }}-apply.log"

      - name: Read preview URL
        id: preview_url
        if: inputs.mode == 'apply'
        run: |
          cd terraform
          url="$(terraform output -json | jq -r '.urls.value["us-east5"] // ""')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Destroy production Terraform
        id: destroy
        if: inputs.mode == 'destroy' && inputs.pr_number == ''
        shell: bash
        run: |
          set -o pipefail
          make tf-prod ACTION=destroy 2>&1 | tee ".github-artifacts/terraform/${{ inputs.tf_workspace }}-destroy.log"

      - name: Destroy preview Terraform
        id: destroy_preview
        if: inputs.mode == 'destroy' && inputs.pr_number != ''
        shell: bash
        run: |
          set -o pipefail
          make tf-preview PR=${{ inputs.pr_number }} BRANCH=${{ inputs.docker_compose_branch }} ACTION=destroy 2>&1 | tee ".github-artifacts/terraform/${{ inputs.tf_workspace }}-destroy.log"

      - name: Upload Terraform logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-logs-${{ inputs.tf_workspace }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-artifacts/terraform
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture status
        id: capture
        if: always()
        run: |
          image_ref="$(printf '%s' '${{ inputs.image_tag }}' | tr '[:upper:]' '[:lower:]')"
          if [ '${{ inputs.mode }}' = 'apply' ]; then
            status='${{ steps.apply.outcome }}'
            if [ "$status" = '' ]; then
              status='${{ steps.apply_preview.outcome }}'
            fi
          else
            status='${{ steps.destroy.outcome }}'
            if [ "$status" = '' ]; then
              status='${{ steps.destroy_preview.outcome }}'
            fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "image=$image_ref" >> "$GITHUB_OUTPUT"
