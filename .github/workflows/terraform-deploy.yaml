name: Terraform Deploy

# Runs `make tf-prod` or `make tf-preview` (terraform plan/apply/destroy in the
# matching workspace). Terraform executes migrations and readiness jobs.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment holding the credentials (production or preview).
        required: true
        type: string
      action:
        description: plan, apply, or destroy.
        required: true
        type: string
      pr_number:
        description: Pull request number for previews; empty for production.
        required: false
        type: string
        default: ""
      image_tag:
        description: Backend and frontend image tag to deploy.
        required: false
        type: string
        default: main
    outputs:
      url:
        description: Public URL after an apply.
        value: ${{ jobs.terraform.outputs.url }}

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-${{ inputs.pr_number != '' && format('pr-{0}', inputs.pr_number) || 'prod' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_CLI_ARGS_apply: -auto-approve
      TF_CLI_ARGS_destroy: -auto-approve
      TF_VAR_image_tag: ${{ inputs.image_tag }}
      ACTION: ${{ inputs.action }}
      PR_NUMBER: ${{ inputs.pr_number }}
      REGION: ${{ vars.SCRIBE_REGION != '' && vars.SCRIBE_REGION || 'us-east5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCLOUD_PROJECT }}
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: 576.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: v1.16.5
          terraform_wrapper: false

      - name: Export configured Terraform variables
        env:
          region: ${{ vars.SCRIBE_REGION }}
          allowed_ips: ${{ vars.ALLOWED_IPS }}
          monitoring_notification_channels: ${{ vars.MONITORING_NOTIFICATION_CHANNELS }}
          network_ip_cidr_range: ${{ vars.NETWORK_IP_CIDR_RANGE }}
          iiif_max_manifest_canvases: ${{ vars.IIIF_MAX_MANIFEST_CANVASES }}
          iiif_max_manifest_import_bytes: ${{ vars.IIIF_MAX_MANIFEST_IMPORT_BYTES }}
          storage_max_bytes_per_workspace: ${{ vars.STORAGE_MAX_BYTES_PER_WORKSPACE }}
          storage_max_bytes_total: ${{ vars.STORAGE_MAX_BYTES_TOTAL }}
          storage_max_images_per_workspace: ${{ vars.STORAGE_MAX_IMAGES_PER_WORKSPACE }}
          storage_max_images_total: ${{ vars.STORAGE_MAX_IMAGES_TOTAL }}
          storage_max_items_per_workspace: ${{ vars.STORAGE_MAX_ITEMS_PER_WORKSPACE }}
          storage_max_items_total: ${{ vars.STORAGE_MAX_ITEMS_TOTAL }}
          storage_normalization_cache_max_age: ${{ vars.STORAGE_NORMALIZATION_CACHE_MAX_AGE }}
          storage_normalization_cache_max_bytes: ${{ vars.STORAGE_NORMALIZATION_CACHE_MAX_BYTES }}
          storage_reservation_ttl: ${{ vars.STORAGE_RESERVATION_TTL }}
          transcription_max_active_jobs_per_workspace: ${{ vars.TRANSCRIPTION_MAX_ACTIVE_JOBS_PER_WORKSPACE }}
        # Unset GitHub variables are empty strings; leave those to Terraform's defaults.
        run: |
          for name in region allowed_ips monitoring_notification_channels \
            network_ip_cidr_range iiif_max_manifest_canvases iiif_max_manifest_import_bytes \
            storage_max_bytes_per_workspace storage_max_bytes_total storage_max_images_per_workspace \
            storage_max_images_total storage_max_items_per_workspace storage_max_items_total \
            storage_normalization_cache_max_age storage_normalization_cache_max_bytes \
            storage_reservation_ttl transcription_max_active_jobs_per_workspace; do
            if [ -n "${!name}" ]; then
              echo "TF_VAR_${name}=${!name}" >> "$GITHUB_ENV"
            fi
          done

      - name: Terraform ${{ inputs.action }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            make tf-preview PR="$PR_NUMBER" ACTION="$ACTION"
          else
            make tf-prod ACTION="$ACTION"
          fi

      - name: Delete the preview workspace
        if: inputs.action == 'destroy' && inputs.pr_number != ''
        run: |
          terraform -chdir=terraform workspace select default
          terraform -chdir=terraform workspace delete "pr-${PR_NUMBER}"

      - name: Read URL
        id: url
        if: inputs.action == 'apply'
        run: echo "url=$(terraform -chdir=terraform output -json urls | jq -r 'to_entries[0].value')" >> "$GITHUB_OUTPUT"
