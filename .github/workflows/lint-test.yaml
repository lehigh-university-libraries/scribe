name: lint-test
on:
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6

      - run: make lint

      - name: Start test database
        run: make up-db

      - name: Run tests
        run: make test

      - name: Tear down test services
        if: always()
        run: make down
