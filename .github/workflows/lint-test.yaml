name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true
      - name: Install pinned generators
        run: make install-codegen-tools
      - name: Lint source and protobuf contracts
        run: make lint
      - name: Verify generated Go, TypeScript, SQL, and OpenAPI files
        run: make generate-check

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mirador-scribe/package-lock.json
      - name: Start integration database
        run: make up-db
      - name: Run backend, frontend, and plugin tests
        run: make test
      - name: Run DB-backed ingest and revision smoke tests
        run: make e2e-smoke
      - name: Check OCR model routes and build modes
        run: make ocr-build-tags
      - name: Tear down test services
        if: always()
        run: make down

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: scribe-browser-${{ github.run_id }}-${{ github.run_attempt }}
      SCRIBE_REQUIRE_BROWSER_BACKEND: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Start isolated browser-test database
        run: make up-db
      - name: Run real Chromium editor acceptance tests
        run: make test-browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down browser-test database
        if: always()
        run: docker compose down --volumes --remove-orphans

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mirador-scribe/package-lock.json
      - name: Install pinned security scanners
        run: make install-security-tools
      - name: Run reachable Go and npm advisory checks
        run: make security
      - name: Create a synthetic credential scanner fixture
        shell: bash
        run: |
          mkdir .secret-scan-regression
          printf 'GITHUB_TOKEN=%s%s\n' 'ghp_' '7tQ2mN8vK4xP6cR9wB3yH5jL1sD0fA2uE6iZ' > .secret-scan-regression/credential.txt
      - name: Verify synthetic credential detection
        id: secret_regression
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .secret-scan-regression
          scanners: secret
          exit-code: "1"
      - name: Assert the secret scanner rejected the fixture
        if: steps.secret_regression.outcome != 'failure'
        run: |
          echo "Trivy did not reject the synthetic GitHub credential fixture" >&2
          exit 1
      - name: Remove the synthetic credential fixture
        if: always()
        run: rm -f .secret-scan-regression/credential.txt; rmdir .secret-scan-regression 2>/dev/null || true
      - name: Scan locked dependencies for high and critical vulnerabilities
        run: make dependency-scan

  infrastructure-and-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Validate Terraform modules
        run: make terraform-check
      - name: Verify transitive Terraform state normalization
        run: make terraform-state-normalizer-test
      - name: Verify targeted output preservation
        run: make terraform-targeted-output-test
      - name: Verify operational security contracts
        run: make ops-security-contracts
      - name: Build documentation with pinned Zensical
        run: make docs-build

  recovery-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Exercise isolated database and blob backup/restore
        run: make backup-restore-smoke
      - name: Test cloud backup policy and freshness verification
        run: make verify-cloud-backups-test
      - name: Test isolated cloud snapshot restore drill
        run: make cloud-snapshot-restore-drill-test
      - name: Test MariaDB backup retention markers
        run: make mariadb-backup-retention-test
      - name: Verify trusted preview inputs and immutable teardown
        run: make preview-deployment-test
      - name: Verify OCR readiness fixture and deep-response assertions
        run: make readiness-fixture-test
      - name: Verify deployment status precedence
        run: make deployment-status-test
