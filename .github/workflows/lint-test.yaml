name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true
      - name: Install pinned generators
        run: make install-codegen-tools
      - name: Run contracts and lint group
        run: ./ci/run-ci.sh contracts

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SCRIBE_REQUIRE_TEST_DB: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mirador-scribe/package-lock.json
      - name: Run application test group
        run: ./ci/run-ci.sh test

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: scribe-browser-${{ github.run_id }}-${{ github.run_attempt }}
      SCRIBE_REQUIRE_BROWSER_BACKEND: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Run browser acceptance group
        run: ./ci/run-ci.sh browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mirador-scribe/package-lock.json
      - name: Install pinned security scanners
        run: make install-security-tools
      - name: Run security group
        run: ./ci/run-ci.sh security
      - name: Create a synthetic credential scanner fixture
        shell: bash
        run: |
          mkdir .secret-scan-regression
          printf 'GITHUB_TOKEN=%s%s\n' 'ghp_' '7tQ2mN8vK4xP6cR9wB3yH5jL1sD0fA2uE6iZ' > .secret-scan-regression/credential.txt
      - name: Verify synthetic credential detection
        id: secret_regression
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .secret-scan-regression
          scanners: secret
          exit-code: "1"
      - name: Assert the secret scanner rejected the fixture
        if: steps.secret_regression.outcome != 'failure'
        run: |
          echo "Trivy did not reject the synthetic GitHub credential fixture" >&2
          exit 1
      - name: Remove the synthetic credential fixture
        if: always()
        run: rm -f .secret-scan-regression/credential.txt; rmdir .secret-scan-regression 2>/dev/null || true

  infrastructure-and-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - name: Run infrastructure and documentation group
        run: ./ci/run-ci.sh infrastructure

  recovery-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true
      - name: Run recovery and deployment-smoke group
        run: ./ci/run-ci.sh recovery
