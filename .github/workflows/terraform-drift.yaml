name: Terraform Drift

on:
  workflow_dispatch:
  schedule:
    - cron: "21 10 * * *"

permissions:
  contents: read
  issues: write
  id-token: write
  packages: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    env:
      GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_PLAN_DETAILED_EXITCODE: "true"
      SCRIBE_API_IMAGE: ghcr.io/lehigh-university-libraries/scribe:main
      SCRIBE_FRONTEND_IMAGE: ghcr.io/lehigh-university-libraries/scribe-frontend:main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4
        with:
          terraform_version: 1.5.7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}
          token_format: access_token
          access_token_scopes: |-
            https://www.googleapis.com/auth/cloud-platform
            https://www.googleapis.com/auth/userinfo.email

      - name: Configure gcloud
        run: |
          gcloud config set project "${GCLOUD_PROJECT}"
          gcloud config set disable_prompts true

      - name: "GHCR login"
        uses: "docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121" # v4
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Resolve pinned GHCR images
        shell: bash
        run: |
          api_image="$(./ci/resolve-ghcr-image.sh "$SCRIBE_API_IMAGE")"
          frontend_image="$(./ci/resolve-ghcr-image.sh "$SCRIBE_FRONTEND_IMAGE")"
          echo "SCRIBE_API_IMAGE=$api_image" >> "$GITHUB_ENV"
          echo "SCRIBE_FRONTEND_IMAGE=$frontend_image" >> "$GITHUB_ENV"

      - name: Authenticate Vault admin header token
        id: auth_vault_access
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/userinfo.email
          create_credentials_file: false

      - name: Resolve Vault address
        id: vault_addr
        shell: bash
        run: |
          vault_addr="$(gcloud run services describe vault-server-prod --region us-east5 --format='value(status.url)')"
          vault_audience="$(gcloud run services describe vault-server-prod --region us-east5 --format='value(uri)')"
          if [ -z "$vault_audience" ]; then
            vault_audience="$vault_addr"
          fi
          echo "vault_addr=$vault_addr" >> "$GITHUB_OUTPUT"
          echo "vault_audience=$vault_audience" >> "$GITHUB_OUTPUT"

      - name: Compute Vault CI role name
        id: vault_role
        shell: bash
        env:
          VAULT_GSA: ${{ secrets.GSA }}
        run: |
          sanitized="$(printf '%s' "$VAULT_GSA" | sed 's/@/-at-/g; s/\./-/g')"
          echo "role_name=ci-${sanitized}" >> "$GITHUB_OUTPUT"

      - name: Authenticate Google ID token for Vault
        id: auth_vault_id
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCLOUD_OIDC_POOL }}
          service_account: ${{ secrets.GSA }}
          token_format: id_token
          id_token_audience: ${{ steps.vault_addr.outputs.vault_audience }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Login to Vault
        shell: bash
        env:
          VAULT_ADDR: ${{ steps.vault_addr.outputs.vault_addr }}
          VAULT_ADMIN_TOKEN: ${{ steps.auth_vault_access.outputs.access_token }}
          VAULT_ID_TOKEN: ${{ steps.auth_vault_id.outputs.id_token }}
          VAULT_ROLE: ${{ steps.vault_role.outputs.role_name }}
        run: bash ./ci/vault-login.sh

      - name: Run detailed production plan
        shell: bash
        run: make tf-prod ACTION=plan

  open-issue:
    if: failure() && github.event_name == 'schedule'
    needs: [plan]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open drift issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'Terraform drift detected in production';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            if (issues.some(issue => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Scheduled production Terraform plan failed or reported drift.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
