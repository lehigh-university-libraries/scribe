name: Build OCR Images

# Builds every OCR image from config/ocr.yaml and pushes it to Artifact
# Registry as :main and :<commit>. Terraform deploys the :main tag.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: false
      - id: gen
        env:
          GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
        run: echo "matrix=$(go run ./cmd/ocr-matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.key }}
    needs: [matrix]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.OCR_GCLOUD_OIDC_POOL }}
          service_account: ${{ vars.OCR_GSA }}
          token_format: access_token
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ matrix.image }}
            ${{ matrix.gar_image }}:${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          provenance: true
          sbom: true
