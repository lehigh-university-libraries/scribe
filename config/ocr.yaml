# Deploy-time OCR image and Cloud Run metadata. Runtime application defaults
# remain in config.yaml; CI and Terraform are the only consumers of this file.
artifact_registry:
  # OCR publishers receive repository-level writer access only to these
  # reviewed Docker repositories. Project-wide Artifact Registry writer is
  # forbidden by the external identity bootstrap contract.
  ocr_publish_repositories:
    - location: us
      repository: internal
layout:
  model_dir: /models/pp-doclayout-v3
  models:
    ppdoclayout:
      label: PP-DocLayoutV3 regions
      granularity: region
    layout+kraken:
      label: PP-DocLayoutV3 + Kraken BLLA
      granularity: line
    newspapers:
      label: Newspapers (PP-DocLayoutV3 + Kraken BLLA)
      granularity: line
      alias: layout+kraken
kraken:
  pip_spec: "kraken==7.0.2"
  default_segmentation_model: kraken
  segmentation_models:
    kraken:
      file: blla.mlmodel
      doi: "10.5281/zenodo.14602569"
      sha256: "77a638a83c9e535620827a09e410ed36391e9e8e8126d5796a0f15b978186056"
  recognition_models:
    catmus-medieval:
      file: catmus-medieval-1.6.0.mlmodel
      doi: "10.5281/zenodo.21488839"
      sha256: "227d10f15a936c2492105b7796a6152647c742f248af117856f417008eadbc9c"
    mccatmus:
      file: McCATMuS_nfd_nofix_V1.mlmodel
      doi: "10.5281/zenodo.13788177"
      sha256: "dfb911ba25fd11f93efc1b0c340957162981ecfdaac0ee1e26793d491f770244"
ollama:
  base_image: "ollama/ollama:0.40.11@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8"
  default_model: "glm-ocr:bf16"
  cloud_run:
    regions: ["us-east4"]
    memory: "16Gi"
    cpu: "4000m"
    gpu_count: 1
    min_instances: 0
    max_instances: 1
    skip_neg: true
  models:
    glm-ocr:bf16:
      manifest_digest: "89d735dd9c07791953756edd275e5501464df61288b1cd5486c5c50c8c058b32"
