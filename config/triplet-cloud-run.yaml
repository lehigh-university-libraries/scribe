server:
  listen: ":8082"
  public_base_url: "${PUBLIC_BASE_URL}"
  read_timeout: 30s
  write_timeout: 120s
logging:
  level: info
  format: json
vips:
  block_untrusted: true
iiif:
  image:
    enabled: true
    prefix: /iiif/3
    max_output_pixels: 100000000
    max_source_pixels: 250000000
    max_source_bytes: 104857600
    max_concurrent_transforms: 4
  presentation:
    enabled: true
    prefix: /presentation/v3
    dsn: "${TRIPLET_DATABASE_DSN}"
    write_enabled: true
    write_token: "${TRIPLET_PRESENTATION_WRITE_TOKEN}"
sources:
  default: http
  http:
    allowed_origins: ["http://localhost:8080"]
    allow_private_hosts: true
    forward_auth_headers: true
    request_timeout: 2m
    max_bytes: 100MiB
    metadata_cache_ttl: 0s
cache:
  root: /var/lib/triplet/cache
  max_bytes: 268435456
