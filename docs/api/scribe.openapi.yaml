            - integer
            - string
          title: item_image_id
          format: int64
        annotationPageJson:
          type: string
          title: annotation_page_json
          pattern: .*\S.*
        selectedAnnotationId:
          type: string
          title: selected_annotation_id
          pattern: .*\S.*
        words:
          type: array
