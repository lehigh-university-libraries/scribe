    scribe.v1.ProcessHOCRRequest:
      type: object
      properties:
        hocr:
          type: string
          title: hocr
          pattern: .*\S.*
          description: |
            string.max_bytes = 10485760
        imageUrl:
          type: string
          title: image_url
          maxLength: 2048
          pattern: ^$|.*\S.*
        imageData:
          type: string
          title: image_data
          maxLength: 104857600
          format: byte
          description: |
            bytes.const = []
        filename:
          type: string
          title: filename
          maxLength: 255
          pattern: ^$|.*\S.*
        idempotencyKey:
          type: string
          title: idempotency_key
          maxLength: 256
          minLength: 1
        metadata:
          type: string
          title: metadata
          pattern: ^$|.*\S.*
          description: |
            Optional metadata JSON retained on the created item and echoed by
             item-scoped completion, failure, and publication events.
            string.max_bytes = 1048576
        externalReferenceId:
          type: string
          title: external_reference_id
          maxLength: 512
          pattern: ^$|.*\S.*
          description: Stable repository identifier used to correlate the created Scribe item.
      title: ProcessHOCRRequest
      required:
        - hocr
        - idempotencyKey
      additionalProperties: false
      description: |
        process_hocr.image_source // exactly one of image_url or image_data is required
    scribe.v1.ProcessHOCRResponse:
      type: object
      properties:
        itemId:
          type: string
          title: item_id
        itemImageId:
          type:
            - integer
            - string
          title: item_image_id
          format: int64
        imageUrl:
          type: string
          title: image_url
        hocr:
          type: string
          title: hocr
        plainText:
          type: string
          title: plain_text
        sessionId:
          type: string
          title: session_id
          description: |-
            Stable OCR provenance-run identifier. This is not an authentication or
             browser editor session identifier.
        transcriptionJobId:
          type:
            - integer
            - string
          title: transcription_job_id
          format: int64
          description: |-
            Durable asynchronous transcription job. ProcessHOCR is synchronous and
             normally returns zero because the supplied hOCR is the completed result.
      title: ProcessHOCRResponse
      additionalProperties: false
    scribe.v1.ProcessImageURLRequest:
      type: object
      properties:
        imageUrl:
          type: string
          title: image_url
          maxLength: 2048
          pattern: .*\S.*
        contextId:
          type:
            - integer
            - string
          title: context_id
          format: int64
          description: If set, uses this context; otherwise selection engine runs against metadata.
        metadata:
          type: string
          title: metadata
          pattern: ^$|.*\S.*
          description: |
            Optional metadata JSON passed to the selection engine.
            string.max_bytes = 1048576
        idempotencyKey:
          type: string
          title: idempotency_key
          maxLength: 256
          minLength: 1
        externalReferenceId:
          type: string
          title: external_reference_id
          maxLength: 512
          pattern: ^$|.*\S.*
          description: Stable repository identifier used to correlate the created Scribe item.
      title: ProcessImageURLRequest
      required:
        - imageUrl
        - idempotencyKey
      additionalProperties: false
      description: |-
        ProcessImageURLRequest imports and schedules one image fetched from an
         external URL. Retries must reuse idempotency_key.
    scribe.v1.ProcessImageURLResponse:
      type: object
      properties:
        itemId:
          type: string
          title: item_id
        itemImageId:
          type:
            - integer
            - string
          title: item_image_id
          format: int64
        imageUrl:
          type: string
          title: image_url
        hocr:
          type: string
          title: hocr
        plainText:
          type: string
          title: plain_text
        sessionId:
          type: string
          title: session_id
          description: |-
            Stable OCR provenance-run identifier. This is not an authentication or
             browser editor session identifier.
        transcriptionJobId:
          type:
            - integer
            - string
          title: transcription_job_id
          format: int64
          description: |-
