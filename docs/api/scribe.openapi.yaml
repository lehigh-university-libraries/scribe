          format: int64
          description: Optional processing context for Canvases without imported OCR.
        metadata:
          type: string
          title: metadata
          pattern: ^$|.*\S.*
          description: |
            Optional metadata JSON to seed the item (for integrations like Islandora).
            string.max_bytes = 1048576
        idempotencyKey:
          type: string
          title: idempotency_key
          maxLength: 256
          minLength: 1
