          title: id
          format: int64
        email:
          type: string
          title: email
        name:
          type: string
          title: name
        pictureUrl:
          type: string
          title: picture_url
        isAdmin:
          type: boolean
          title: is_admin
        defaultWorkspaceId:
          type:
            - integer
            - string
          title: default_workspace_id
          format: int64
      title: AuthUser
      additionalProperties: false
    scribe.v1.AuthWorkspace:
      type: object
      properties:
        id:
