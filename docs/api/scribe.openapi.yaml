          type: string
          title: metadata
          pattern: ^$|.*\S.*
          description: |
            Optional metadata JSON retained on the created item and echoed by
             item-scoped completion, failure, and publication events.
            string.max_bytes = 1048576
        externalReferenceId:
          type: string
          title: external_reference_id
          maxLength: 512
          pattern: ^$|.*\S.*
      title: StartUploadBatchRequest
      required:
        - batchId
      additionalProperties: false
    scribe.v1.StartUploadBatchResponse:
      type: object
      properties:
        item:
          title: item
          $ref: '#/components/schemas/scribe.v1.Item'
        batch:
          title: batch
          $ref: '#/components/schemas/scribe.v1.UploadBatch'
      title: StartUploadBatchResponse
      additionalProperties: false
    scribe.v1.StreamTranscriptionJobRequest:
      type: object
      properties:
        jobId:
          exclusiveMinimum: 0
          type:
            - integer
            - string
          title: job_id
          format: int64
      title: StreamTranscriptionJobRequest
      required:
        - jobId
      additionalProperties: false
      description: |-
        StreamTranscriptionJobRequest opens a server-sent-events stream for a job.
         The server sends a TranscriptionJob message after every segment is processed
         and once more when the job reaches a terminal state.
    scribe.v1.StreamTranscriptionJobResponse:
      type: object
      properties:
        job:
          title: job
          $ref: '#/components/schemas/scribe.v1.TranscriptionJob'
      title: StreamTranscriptionJobResponse
      additionalProperties: false
    scribe.v1.TranscriptionJob:
      type: object
      properties:
        id:
          type:
            - integer
            - string
          title: id
          format: int64
        itemImageId:
          type:
            - integer
            - string
          title: item_image_id
          format: int64
        contextId:
          type:
            - integer
            - string
          title: context_id
          format: int64
        status:
          title: status
          $ref: '#/components/schemas/scribe.v1.TranscriptionJobStatus'
        totalSegments:
          type: integer
          title: total_segments
          format: int32
        completedSegments:
          type: integer
          title: completed_segments
          format: int32
        failedSegments:
          type: integer
          title: failed_segments
          format: int32
        currentAnnotationId:
          type: string
          title: current_annotation_id
          description: annotation_id of the segment currently being processed.
        currentAnnotationJson:
          type: string
          title: current_annotation_json
          description: |-
            Full annotation JSON of the segment currently being processed, so the
             editor overlay can highlight it without a separate lookup.
        lastResultAnnotationJson:
          type: string
          title: last_result_annotation_json
          description: annotation JSON of the most recently completed segment (with enriched text).
        errorMessage:
          type: string
          title: error_message
        createdAt:
          type: string
          title: created_at
        updatedAt:
          type: string
          title: updated_at
        inputRevision:
          type:
            - integer
            - string
          title: input_revision
          format: int64
        attemptCount:
          type: integer
          title: attempt_count
          format: int32
        maxAttempts:
          type: integer
          title: max_attempts
          format: int32
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/scribe.v1.TranscriptionJobAttempt'
          title: attempts
      title: TranscriptionJob
      additionalProperties: false
      description: |-
        TranscriptionJob represents a batch transcription job for a single item image.
         One job covers all line-level annotations on the canvas; progress is tracked
         segment by segment so the editor overlay can visualise the work in real time.
    scribe.v1.TranscriptionJobAttempt:
      type: object
      properties:
        jobId:
          type:
            - integer
            - string
          title: job_id
          format: int64
        attemptNumber:
          type: integer
          title: attempt_number
        inputRevision:
          type:
            - integer
            - string
          title: input_revision
          format: int64
        contextSnapshotJson:
          type: string
          title: context_snapshot_json
        leaseOwner:
          type: string
          title: lease_owner
        outcome:
          title: outcome
          $ref: '#/components/schemas/scribe.v1.TranscriptionJobAttemptOutcome'
        safeErrorMessage:
          type: string
          title: safe_error_message
        resultRevision:
          type:
            - integer
            - string
          title: result_revision
          format: int64
        startedAt:
          type: string
          title: started_at
        finishedAt:
          type: string
          title: finished_at
      title: TranscriptionJobAttempt
      additionalProperties: false
      description: |-
        TranscriptionJobAttempt is the auditable history of one worker claim. Lease
         tokens are intentionally not exposed through the application API.
    scribe.v1.TranscriptionJobAttemptOutcome:
      type: string
      title: TranscriptionJobAttemptOutcome
      enum:
        - TRANSCRIPTION_JOB_ATTEMPT_OUTCOME_UNSPECIFIED
        - TRANSCRIPTION_JOB_ATTEMPT_OUTCOME_RUNNING
        - TRANSCRIPTION_JOB_ATTEMPT_OUTCOME_COMPLETED
        - TRANSCRIPTION_JOB_ATTEMPT_OUTCOME_RETRYABLE_FAILED
        - TRANSCRIPTION_JOB_ATTEMPT_OUTCOME_FAILED
        - TRANSCRIPTION_JOB_ATTEMPT_OUTCOME_CANCELED
        - TRANSCRIPTION_JOB_ATTEMPT_OUTCOME_SUPERSEDED
        - TRANSCRIPTION_JOB_ATTEMPT_OUTCOME_LEASE_EXPIRED
      description: |-
        TranscriptionJobAttemptOutcome is the terminal reason for one immutable
         worker claim. RUNNING is the only non-terminal value.
    scribe.v1.TranscriptionJobStatus:
      type: string
      title: TranscriptionJobStatus
      enum:
        - TRANSCRIPTION_JOB_STATUS_UNSPECIFIED
        - TRANSCRIPTION_JOB_STATUS_PENDING
        - TRANSCRIPTION_JOB_STATUS_RUNNING
        - TRANSCRIPTION_JOB_STATUS_COMPLETED
        - TRANSCRIPTION_JOB_STATUS_FAILED
        - TRANSCRIPTION_JOB_STATUS_CANCELED
        - TRANSCRIPTION_JOB_STATUS_SUPERSEDED
      description: TranscriptionJobStatus represents the lifecycle state of a batch transcription job.
    scribe.v1.TranscriptionJobSummary:
      type: object
      properties:
        id:
          type:
            - integer
            - string
          title: id
          format: int64
        itemImageId:
          type:
            - integer
            - string
          title: item_image_id
          format: int64
        contextId:
          type:
            - integer
            - string
          title: context_id
          format: int64
        status:
          title: status
          $ref: '#/components/schemas/scribe.v1.TranscriptionJobStatus'
        totalSegments:
          type: integer
          title: total_segments
          format: int32
        completedSegments:
          type: integer
          title: completed_segments
          format: int32
        failedSegments:
          type: integer
          title: failed_segments
          format: int32
        currentAnnotationId:
          type: string
          title: current_annotation_id
        errorMessage:
          type: string
          title: error_message
        createdAt:
          type: string
          title: created_at
        updatedAt:
          type: string
          title: updated_at
        inputRevision:
          type:
            - integer
            - string
          title: input_revision
          format: int64
        attemptCount:
          type: integer
          title: attempt_count
          format: int32
        maxAttempts:
          type: integer
          title: max_attempts
          format: int32
      title: TranscriptionJobSummary
      additionalProperties: false
      description: |-
        TranscriptionJobSummary is the bounded list projection. Per-segment
         annotation payloads and attempt history are available from GetTranscriptionJob
         and the stream, but are deliberately excluded from list responses.
    scribe.v1.UpdateContextRequest:
      type: object
      properties:
        context:
          title: context
          $ref: '#/components/schemas/scribe.v1.Context'
      title: UpdateContextRequest
      required:
        - context
      additionalProperties: false
      description: |
        update_context.id // context.id is required
    scribe.v1.UpdateContextResponse:
      type: object
      properties:
        context:
          title: context
          $ref: '#/components/schemas/scribe.v1.Context'
      title: UpdateContextResponse
      additionalProperties: false
    scribe.v1.UpdateWorkspaceMemberRequest:
      type: object
      properties:
        workspaceId:
          exclusiveMinimum: 0
          type:
            - integer
            - string
          title: workspace_id
          format: int64
        userId:
          exclusiveMinimum: 0
          type:
            - integer
            - string
          title: user_id
          format: int64
        role:
          type: string
          title: role
          maxLength: 6
          pattern: ^(admin|write|create|read)$
      title: UpdateWorkspaceMemberRequest
      required:
        - workspaceId
        - userId
        - role
      additionalProperties: false
    scribe.v1.UpdateWorkspaceMemberResponse:
      type: object
      properties:
        member:
          title: member
          $ref: '#/components/schemas/scribe.v1.WorkspaceMember'
      title: UpdateWorkspaceMemberResponse
      additionalProperties: false
    scribe.v1.UpdateWorkspaceRequest:
      type: object
      properties:
        workspaceId:
          exclusiveMinimum: 0
          type:
            - integer
            - string
          title: workspace_id
          format: int64
        name:
          type: string
          title: name
          maxLength: 255
          pattern: .*\S.*
      title: UpdateWorkspaceRequest
      required:
        - workspaceId
        - name
      additionalProperties: false
    scribe.v1.UpdateWorkspaceResponse:
      type: object
      properties:
        workspace:
          title: workspace
          $ref: '#/components/schemas/scribe.v1.Workspace'
      title: UpdateWorkspaceResponse
      additionalProperties: false
    scribe.v1.UploadBatch:
      type: object
      properties:
        id:
          type: string
          title: id
        itemId:
          type: string
          title: item_id
        contextId:
          type:
            - integer
            - string
          title: context_id
          format: int64
        status:
          title: status
          $ref: '#/components/schemas/scribe.v1.UploadBatchStatus'
        files:
          type: array
          items:
            $ref: '#/components/schemas/scribe.v1.UploadBatchFile'
          title: files
        completedFiles:
          type: integer
          title: completed_files
        failedFiles:
          type: integer
          title: failed_files
        createdAt:
          type: string
          title: created_at
        updatedAt:
          type: string
          title: updated_at
      title: UploadBatch
      additionalProperties: false
    scribe.v1.UploadBatchFile:
      type: object
      properties:
        sequence:
          type: integer
          title: sequence
        filename:
          type: string
          title: filename
        size:
          type:
            - integer
            - string
          title: size
          format: int64
        contentSha256:
          type: string
          title: content_sha256
        status:
          title: status
          $ref: '#/components/schemas/scribe.v1.UploadBatchFileStatus'
        attemptCount:
          type: integer
          title: attempt_count
        maxAttempts:
          type: integer
          title: max_attempts
        itemImageId:
          type:
            - integer
            - string
          title: item_image_id
          format: int64
        transcriptionJobId:
          type:
            - integer
            - string
          title: transcription_job_id
          format: int64
        errorMessage:
          type: string
          title: error_message
      title: UploadBatchFile
      additionalProperties: false
    scribe.v1.UploadBatchFileInput:
      type: object
      properties:
        filename:
          type: string
          title: filename
          maxLength: 255
          minLength: 1
        size:
          exclusiveMinimum: 0
          type:
            - integer
            - string
          title: size
          format: int64
        contentSha256:
          type: string
          title: content_sha256
          pattern: ^[0-9a-f]{64}$
      title: UploadBatchFileInput
      required:
        - filename
        - contentSha256
      additionalProperties: false
      description: |-
        UploadBatchFileInput fixes the ordered file set before processing starts.
         The server verifies content_sha256 when each file is uploaded.
    scribe.v1.UploadBatchFileStatus:
      type: string
      title: UploadBatchFileStatus
      enum:
        - UPLOAD_BATCH_FILE_STATUS_UNSPECIFIED
        - UPLOAD_BATCH_FILE_STATUS_PENDING
        - UPLOAD_BATCH_FILE_STATUS_PROCESSING
        - UPLOAD_BATCH_FILE_STATUS_COMPLETED
        - UPLOAD_BATCH_FILE_STATUS_FAILED
        - UPLOAD_BATCH_FILE_STATUS_CANCELED
    scribe.v1.UploadBatchStatus:
      type: string
      title: UploadBatchStatus
      enum:
        - UPLOAD_BATCH_STATUS_UNSPECIFIED
        - UPLOAD_BATCH_STATUS_IN_PROGRESS
        - UPLOAD_BATCH_STATUS_COMPLETED
        - UPLOAD_BATCH_STATUS_CANCELED
    scribe.v1.UploadItemImageRequest:
      type: object
      properties:
        batchId:
          type: string
          title: batch_id
          pattern: ^[A-Za-z0-9_-]{1,64}$
        sequence:
          exclusiveMinimum: 0
          type: integer
          title: sequence
        imageData:
          type: string
          title: image_data
          maxLength: 104857600
          minLength: 1
          format: byte
          description: |
            bytes.const = []
      title: UploadItemImageRequest
      required:
        - batchId
        - imageData
      additionalProperties: false
      description: UploadItemImageRequest processes one file declared by StartUploadBatch.
    scribe.v1.UploadItemImageResponse:
      type: object
      properties:
        item:
          title: item
          $ref: '#/components/schemas/scribe.v1.Item'
        image:
          title: image
          $ref: '#/components/schemas/scribe.v1.ItemImage'
        transcriptionJobId:
          type:
            - integer
            - string
          title: transcription_job_id
          format: int64
        batch:
          title: batch
          $ref: '#/components/schemas/scribe.v1.UploadBatch'
      title: UploadItemImageResponse
      additionalProperties: false
    scribe.v1.UserProfile:
      type: object
      properties:
        id:
          type:
            - integer
            - string
          title: id
          format: int64
        name:
          type: string
          title: name
        email:
          type: string
          title: email
        pictureUrl:
          type: string
          title: picture_url
        isAdmin:
          type: boolean
          title: is_admin
      title: UserProfile
      additionalProperties: false
    scribe.v1.WebhookSubscription:
      type: object
      properties:
        id:
          type:
            - integer
            - string
          title: id
          format: int64
        workspaceId:
          type:
            - integer
            - string
          title: workspace_id
          format: int64
        targetUrl:
          type: string
          title: target_url
        createdAt:
          type: string
          title: created_at
        updatedAt:
          type: string
          title: updated_at
      title: WebhookSubscription
      additionalProperties: false
      description: |-
        WebhookSubscription is one workspace-owned outbound CloudEvent target. The
         signing secret is write-only and is never returned by Scribe.
    scribe.v1.Workspace:
      type: object
      properties:
        id:
          type:
            - integer
            - string
          title: id
          format: int64
        name:
          type: string
          title: name
        slug:
          type: string
          title: slug
        isPersonal:
          type: boolean
          title: is_personal
        ownerUserId:
          type:
            - integer
            - string
          title: owner_user_id
          format: int64
        createdAt:
          type: string
          title: created_at
        updatedAt:
          type: string
          title: updated_at
      title: Workspace
      additionalProperties: false
    scribe.v1.WorkspaceAccess:
      type: object
      properties:
        workspace:
          title: workspace
          $ref: '#/components/schemas/scribe.v1.Workspace'
        role:
          type: string
          title: role
      title: WorkspaceAccess
      additionalProperties: false
    scribe.v1.WorkspaceMember:
      type: object
      properties:
        workspaceId:
          type:
            - integer
            - string
          title: workspace_id
          format: int64
        user:
          title: user
          $ref: '#/components/schemas/scribe.v1.UserProfile'
        role:
          type: string
          title: role
        createdAt:
          type: string
          title: created_at
      title: WorkspaceMember
      additionalProperties: false
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: scribe_session
      description: Interactive browser session cookie. The cookie name is deployment-configurable; scribe_session is the default.
    ScribeAPIKey:
      type: apiKey
      in: header
      name: X-Scribe-API-Key
      description: Workspace-scoped Scribe API key.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Scribe API key or registered external JWT
security:
  - SessionCookie: []
  - ScribeAPIKey: []
  - BearerAuth: []
tags:
  - name: scribe.v1.AnnotationService
  - name: scribe.v1.AuthService
  - name: scribe.v1.ContextService
  - name: scribe.v1.ItemService
  - name: scribe.v1.ImageProcessingService
  - name: scribe.v1.TranscriptionService
  - name: scribe.v1.WebhookService
  - name: scribe.v1.WorkspaceService
