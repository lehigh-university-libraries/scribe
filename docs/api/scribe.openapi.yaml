            - integer
            - string
          title: id
          format: int64
        name:
          type: string
          title: name
        role:
          type: string
          title: role
      title: AuthWorkspace
      additionalProperties: false
    scribe.v1.CancelTranscriptionJobRequest:
      type: object
      properties:
        jobId:
          exclusiveMinimum: 0
          type:
            - integer
            - string
          title: job_id
          format: int64
      title: CancelTranscriptionJobRequest
      required:
        - jobId
      additionalProperties: false
    scribe.v1.CancelTranscriptionJobResponse:
      type: object
      properties:
        job:
          title: job
          $ref: '#/components/schemas/scribe.v1.TranscriptionJob'
      title: CancelTranscriptionJobResponse
      additionalProperties: false
    scribe.v1.CancelUploadBatchRequest:
      type: object
      properties:
        batchId:
          type: string
          title: batch_id
          pattern: ^[A-Za-z0-9_-]{1,64}$
      title: CancelUploadBatchRequest
      required:
        - batchId
      additionalProperties: false
    scribe.v1.CancelUploadBatchResponse:
      type: object
      properties:
        batch:
          title: batch
          $ref: '#/components/schemas/scribe.v1.UploadBatch'
      title: CancelUploadBatchResponse
      additionalProperties: false
    scribe.v1.Context:
      type: object
      properties:
        id:
          type:
            - integer
            - string
          title: id
          format: int64
        userId:
          type:
            - integer
            - string
          title: user_id
          format: int64
          description: Creator user for workspace-owned contexts; 0 means system context.
        name:
          type: string
          title: name
          maxLength: 255
          pattern: .*\S.*
        description:
          type: string
          title: description
          maxLength: 4096
          pattern: ^$|.*\S.*
        isDefault:
          type: boolean
          title: is_default
        segmentationModel:
          type: string
          title: segmentation_model
          maxLength: 255
          pattern: ^[a-z0-9][a-z0-9._:-]{0,254}$
          description: 'Segmentation model: "tesseract" | "scribe" | "kraken:<model-id>"'
        transcriptionProvider:
          type: string
          title: transcription_provider
          maxLength: 64
          pattern: ^[a-z][a-z0-9_-]{0,63}$
        transcriptionModel:
          type: string
          title: transcription_model
          maxLength: 255
          pattern: ^$|.*\S.*
        temperature:
          type: number
          title: temperature
          maximum: 2
          minimum: 0
          format: double
          nullable: true
        systemPrompt:
          type: string
          title: system_prompt
          maxLength: 8192
          pattern: ^$|.*\S.*
        createdAt:
          type: string
          title: created_at
        updatedAt:
          type: string
          title: updated_at
      title: Context
      required:
        - name
        - segmentationModel
        - transcriptionProvider
      additionalProperties: false
      description: Context bundles all processing parameters for a pipeline run.
    scribe.v1.ContextMetrics:
      type: object
      properties:
        contextId:
          type:
            - integer
            - string
          title: context_id
          format: int64
        totalRuns:
          type:
            - integer
            - string
          title: total_runs
          format: int64
        correctedRuns:
          type:
            - integer
            - string
          title: corrected_runs
          format: int64
        avgLevenshteinDistance:
          type: number
          title: avg_levenshtein_distance
          format: double
      title: ContextMetrics
      additionalProperties: false
      description: |-
        ContextMetrics summarizes correction effort against the immutable OCR
         baseline. Canonical AnnotationPage revisions are the only correction source.
    scribe.v1.ContextSelectionRule:
      type: object
      properties:
        id:
          type:
            - integer
            - string
          title: id
          format: int64
        contextId:
          exclusiveMinimum: 0
          type:
            - integer
            - string
          title: context_id
          format: int64
        priority:
          type: integer
          title: priority
          format: int32
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/scribe.v1.RuleCondition'
          title: conditions
          maxItems: 32
          minItems: 1
      title: ContextSelectionRule
      required:
        - contextId
      additionalProperties: false
      description: |-
        ContextSelectionRule maps a set of AND conditions to a context.
         The engine evaluates rules ordered by priority (descending); the first
         fully-matching rule wins. If no rule matches, the default context is used.
    scribe.v1.CreateAPIKeyRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          maxLength: 255
          pattern: .*\S.*
        role:
          type: string
          title: role
          maxLength: 6
          pattern: ^(admin|write|create|read)$
        scopes:
          type: array
          items:
            type: string
            maxLength: 64
            pattern: ^(\*|[a-z_]+:[a-z_*]+)$
            maxItems: 32
            uniqueItems: true
          title: scopes
          maxItems: 32
          uniqueItems: true
        expiresAt:
          type: string
          title: expires_at
          maxLength: 40
      title: CreateAPIKeyRequest
      required:
        - name
        - role
      additionalProperties: false
    scribe.v1.CreateAPIKeyResponse:
      type: object
      properties:
        apiKey:
          title: api_key
          $ref: '#/components/schemas/scribe.v1.APIKeyRecord'
        key:
          type: string
          title: key
      title: CreateAPIKeyResponse
      additionalProperties: false
    scribe.v1.CreateContextRequest:
      type: object
      properties:
        context:
          title: context
          $ref: '#/components/schemas/scribe.v1.Context'
      title: CreateContextRequest
      required:
        - context
      additionalProperties: false
    scribe.v1.CreateContextResponse:
      type: object
      properties:
        context:
          title: context
          $ref: '#/components/schemas/scribe.v1.Context'
      title: CreateContextResponse
      additionalProperties: false
    scribe.v1.CreateEditorReviewTokenRequest:
      type: object
      properties:
        itemImageId:
          exclusiveMinimum: 0
          type:
            - integer
            - string
          title: item_image_id
          format: int64
        reviewerSubject:
          type: string
          title: reviewer_subject
          maxLength: 255
          pattern: .*\S.*
          description: Stable, issuer-local identity. Scribe stores only its digest.
        reviewerName:
          type: string
          title: reviewer_name
          maxLength: 255
          pattern: .*\S.*
        reviewerEmail:
          type: string
          title: reviewer_email
          maxLength: 320
        tokenTtlSeconds:
          type: integer
          title: token_ttl_seconds
          description: Defaults to five minutes; accepted range is one through ten minutes.
        sessionTtlSeconds:
          type: integer
          title: session_ttl_seconds
          description: Defaults to two hours; accepted range is five minutes through eight hours.
      title: CreateEditorReviewTokenRequest
      required:
        - itemImageId
        - reviewerSubject
        - reviewerName
      additionalProperties: false
      description: |
        CreateEditorReviewTokenRequest asks a registered machine integration to
         vouch for one human reviewer and one exact item image. The returned link is
         a one-time browser handoff, not a reusable API credential.
        editor_review_token.lifetimes // item_image_id and reviewer identity are required; token/session lifetimes must stay within their bounded ranges
    scribe.v1.CreateEditorReviewTokenResponse:
      type: object
      properties:
        reviewUrl:
          type: string
          title: review_url
        expiresAt:
          type: string
          title: expires_at
        workspaceId:
          type:
            - integer
            - string
          title: workspace_id
          format: int64
        itemId:
          type: string
          title: item_id
        itemImageId:
          type:
            - integer
            - string
          title: item_image_id
          format: int64
      title: CreateEditorReviewTokenResponse
      additionalProperties: false
    scribe.v1.CreateProviderSecretRequest:
      type: object
      properties:
        provider:
          type: string
