components:
  schemas:
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    scribe.v1.APIKeyRecord:
      type: object
      properties:
        id:
          type:
            - integer
            - string
          title: id
          format: int64
        workspaceId:
          type:
            - integer
            - string
          title: workspace_id
          format: int64
        createdByUserId:
          type:
            - integer
            - string
          title: created_by_user_id
          format: int64
        name:
          type: string
          title: name
        keyPrefix:
          type: string
          title: key_prefix
        role:
          type: string
          title: role
        scopes:
          type: array
          items:
            type: string
          title: scopes
        expiresAt:
          type: string
          title: expires_at
        createdAt:
          type: string
          title: created_at
        updatedAt:
          type: string
          title: updated_at
      title: APIKeyRecord
      additionalProperties: false
    scribe.v1.AddWorkspaceMemberRequest:
      type: object
      properties:
        workspaceId:
          exclusiveMinimum: 0
          type:
            - integer
            - string
          title: workspace_id
          format: int64
        email:
          type: string
          title: email
          maxLength: 254
          format: email
        role:
          type: string
          title: role
          maxLength: 6
          pattern: ^(admin|write|create|read)$
      title: AddWorkspaceMemberRequest
      required:
        - workspaceId
        - email
        - role
      additionalProperties: false
    scribe.v1.AddWorkspaceMemberResponse:
      type: object
      properties:
        member:
          title: member
          $ref: '#/components/schemas/scribe.v1.WorkspaceMember'
      title: AddWorkspaceMemberResponse
      additionalProperties: false
    scribe.v1.AnnotationExportFormat:
      type: string
      title: AnnotationExportFormat
      enum:
        - ANNOTATION_EXPORT_FORMAT_UNSPECIFIED
        - ANNOTATION_EXPORT_FORMAT_PLAIN_TEXT
        - ANNOTATION_EXPORT_FORMAT_HOCR
        - ANNOTATION_EXPORT_FORMAT_PAGE_XML
        - ANNOTATION_EXPORT_FORMAT_ALTO_XML
      description: |-
        AnnotationExportFormat selects a rebuildable view of one committed canonical
         AnnotationPage. Export operations never accept caller-supplied annotation
         JSON, so every format is derived from the same tenant-owned revision.
    scribe.v1.AnnotationGranularity:
      type: string
      title: AnnotationGranularity
      enum:
        - ANNOTATION_GRANULARITY_UNSPECIFIED
        - ANNOTATION_GRANULARITY_ALL
        - ANNOTATION_GRANULARITY_PAGE
        - ANNOTATION_GRANULARITY_BLOCK
        - ANNOTATION_GRANULARITY_PARAGRAPH
        - ANNOTATION_GRANULARITY_LINE
        - ANNOTATION_GRANULARITY_WORD
        - ANNOTATION_GRANULARITY_GLYPH
    scribe.v1.AuthUser:
      type: object
      properties:
        id:
          type:
            - integer
