          title: item_image_id
          format: int64
        annotationPageJson:
          type: string
          title: annotation_page_json
          pattern: .*\S.*
      title: SplitPageIntoWordsRequest
      required:
        - itemImageId
        - annotationPageJson
      additionalProperties: false
