            Exact tenant-scoped image whose region will be transcribed. Canvas IDs are
             targets/provenance and are not authorization or lookup keys.
        scope:
          type: string
          title: scope
          pattern: .*\S.*
          description: '"line" = single Annotation JSON; "page" = full AnnotationPage JSON'
        annotationJson:
          type: string
          title: annotation_json
          pattern: .*\S.*
        contextId:
          type:
            - integer
            - string
          title: context_id
          format: int64
          description: 'Optional: override context used for transcription'
      title: EnrichAnnotationRequest
      required:
        - itemImageId
      additionalProperties: false
      description: |
        EnrichAnnotationRequest sends a IIIF annotation (one line or an entire
         AnnotationPage) to Scribe's transcription service for improvement.
         The caller provides the raw JSON and specifies the scope.
        enrich_annotation.scope // item_image_id and annotation_json are required, and scope must be line or page
    scribe.v1.EnrichAnnotationResponse:
