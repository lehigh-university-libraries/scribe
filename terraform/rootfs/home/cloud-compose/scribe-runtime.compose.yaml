# Terraform owns this narrow cloud compatibility overlay so an automatic
# rollback to the immediately previous application SHA still receives its
# fixed-proxy IPAM contract. Local and CI Compose use automatic bridge IPAM.
services:
  traefik:
    networks:
      default:
        ipv4_address: ${SCRIBE_TRAEFIK_IP:-172.30.0.2}

networks:
  default:
    ipam:
      config:
        - subnet: ${SCRIBE_COMPOSE_SUBNET:-172.30.0.0/24}
          ip_range: ${SCRIBE_COMPOSE_IP_RANGE:-172.30.0.128/25}
          gateway: ${SCRIBE_COMPOSE_GATEWAY:-172.30.0.1}
