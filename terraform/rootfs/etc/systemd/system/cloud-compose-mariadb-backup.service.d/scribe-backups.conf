[Unit]
RequiresMountsFor=/mnt/disks/data

[Service]
Environment=MARIADB_BACKUP_ROOT=/mnt/disks/data/backups/mariadb
Environment=SCRIBE_MARIADB_BACKUP_RETAIN_COMPLETED=1
ExecStartPre=/bin/bash /home/cloud-compose/scribe-prune-mariadb-backups.sh
ExecStartPre=/bin/bash /home/cloud-compose/scribe-check-mariadb-backup-capacity.sh
ExecStartPost=/bin/bash /home/cloud-compose/scribe-mark-mariadb-backup.sh
ExecStartPost=/bin/bash /home/cloud-compose/scribe-prune-mariadb-backups.sh
